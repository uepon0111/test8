<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>プロセカ 譜面ビューア</title>
    <style>
:root{color-scheme:light;--ink:#27324a;--mut:#74829f;--acc:#2fbfae;--ln:#dde8f6;--bg2:#f4f8fd}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:14px/1.5 system-ui,"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;color:var(--ink);background:linear-gradient(135deg,#eaf7ff,#fff3fa) fixed;min-height:100dvh}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;height:52px;padding:0 12px;background:#fff;border-bottom:3px solid var(--acc)}
.top h1{font-size:17px;margin:0}
button,.btn{cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--acc);color:#fff;font:inherit;font-weight:700;text-decoration:none;display:inline-block}
button.g,.btn.g{background:#e8f1fb;color:var(--ink)}
:focus-visible{outline:3px solid #1b8f82;outline-offset:2px}
#menu{width:40px;height:40px;padding:0;font-size:20px}
#nav{position:fixed;inset:0 auto 0 0;z-index:40;width:240px;max-width:84vw;padding:10px;background:#fff;box-shadow:4px 0 24px #1a2f5a33;transform:translateX(-105%);transition:transform .2s}
#nav.open{transform:none}
#nav header{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 10px;font-weight:700}
#nav a{display:block;padding:12px 14px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:700}
#nav a:hover{background:#eef6fb}#nav a[aria-current]{background:#e1f6f2;color:#13796d}
#scrim{position:fixed;inset:0;z-index:35;background:#10203a55}
@media(prefers-reduced-motion:reduce){#nav{transition:none}}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:14px;box-shadow:0 2px 8px #6aa0d014;margin-bottom:14px}
h2{font-size:14px;margin:0 0 10px;color:#13796d}h3{margin:0 0 4px;font-size:17px}
.mut,small{color:var(--mut);font-size:12px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;font:inherit;background:#fbfdff;color:inherit}
.hero{display:flex;gap:16px;flex-wrap:wrap}.hero>div,.info>div{min-width:0;flex:1 1 240px}
.big{width:140px;height:140px;border-radius:14px;box-shadow:0 4px 14px #0003;flex:none;background:#eef}
.jk{width:72px;height:72px;border-radius:10px;box-shadow:0 2px 8px #0002;flex:none;background:#eef}
.info{display:flex;gap:12px;align-items:center}
.dcs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;align-items:center}
.dc{display:inline-flex;gap:6px;align-items:baseline;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;color:#fff;text-decoration:none}
.dc small{color:#fffd}.dc.nt{background:#4b5b78}
#stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
#stats div{background:var(--bg2);border-radius:10px;padding:10px;text-align:center;color:var(--mut);font-size:12px}
#stats b{display:block;font-size:19px;color:var(--ink)}
#recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.rc{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:inherit}
.rc img{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover;background:#eef}
.rc b{font-size:12px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#s-list{display:flex;flex-direction:column;height:calc(100dvh - 52px - 28px);min-height:440px}
.tb{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:6px}
#list{position:relative;flex:1;min-height:0;overflow:auto;background:#fff;border:1px solid var(--ln);border-radius:12px}
.it{position:absolute;left:0;right:0;height:68px;display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--ln);text-decoration:none;color:inherit}
.it:hover{background:#e9f8f5}.it img{width:50px;height:50px;border-radius:8px;flex:none;background:#eef}
.it span{min-width:0;flex:1}.it b,.it small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb{font-style:normal;color:#fff;font-weight:700;border-radius:999px;padding:2px 10px;font-size:12px;flex:none}
.pad{padding:16px}#vsp{position:relative}
#dlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dbtn{display:flex;flex-direction:column;border-radius:12px;padding:12px 14px;color:#fff;text-decoration:none;background:var(--c)}
.dbtn b{font-size:15px}.dbtn span{font-size:26px;font-weight:800;line-height:1.2}.dbtn small{color:#fffd}
.cbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:10px 0}
#s-chart{display:flex;flex-direction:column;height:calc(100dvh - 80px);min-height:560px}#s-chart>.card{flex:none}#chart{flex:1;min-height:260px;overflow:auto;background:#111827;border-radius:12px;color:#c4d2e4}
.msg{padding:30px}#chart img.sv{display:block;height:auto}
.set{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:14px;align-items:start}
@media(max-width:760px){.set{grid-template-columns:1fr}}
.fld{margin-bottom:16px}.fld label{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:4px}
.pvc{position:sticky;top:66px}
#pv{overflow:auto;max-height:68vh;min-height:200px;background:#111827;border-radius:10px}
#pv svg{display:block;margin:0 auto}
#st{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;max-width:92vw;background:#27324aee;color:#fff;border-radius:10px;padding:8px 14px;font-size:12px}
      .lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,232px),1fr));gap:8px}
      .lgp{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:4px 6px;padding:6px 8px;background:#f4f8fd;border:1px solid var(--ln);border-radius:10px}
      .lgc{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;text-align:center}
      .lgv{display:flex;align-items:center;justify-content:center;width:64px;height:52px;flex:none}
      .lgv svg{display:block;overflow:visible}
      .lgn{font-size:10px;line-height:1.3;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
    </style>
  </head>
  <body>
    <header class="top"><button id="menu" aria-label="メニューを開く" aria-expanded="false" aria-controls="nav">☰</button><h1 id="ttl">ホーム</h1></header>
    <div id="scrim" hidden></div>
    <nav id="nav" aria-label="メインメニュー" inert>
      <header><span>♪ プロセカ 譜面ビューア</span><button id="navx" class="g" aria-label="メニューを閉じる">✕</button></header>
      <a href="#home" data-p="home">ホーム</a><a href="#songs" data-p="songs">曲を探す</a><a href="#settings" data-p="settings">設定</a>
    </nav>
    <main>
      <section id="p-home" class="pg">
        <div class="card"><h2>最新の曲</h2><div class="hero" id="latest"><span class="mut">楽曲データを読み込み中…</span></div></div>
        <div class="card"><h2>新着曲</h2><div id="recent"></div></div>
        <div class="card"><h2>ノーツの見た目</h2><div id="legend"></div></div>
        <div class="card"><h2>データ概要</h2><div id="stats"></div><p class="mut" style="margin:0">楽曲・譜面データは公開データ（sekai-master-db-diff / sekai.best）から取得します。ノーツ間隔や透明度などは「設定」で変更できます。</p></div>
      </section>
      <section id="p-songs" class="pg" hidden>
        <div id="s-list">
          <div class="tb">
            <input id="q" type="search" placeholder="曲名・作詞・作曲・編曲・ID で検索" aria-label="曲を検索" style="grid-column:1/-1" />
            <select id="unit" aria-label="ユニット"></select>
            <select id="sort" aria-label="並び替え"><option value="date">公開日時順</option><option value="level">レベル順</option></select>
            <select id="dsel" aria-label="レベル順の難易度" hidden></select>
            <button id="ord" class="g"></button>
          </div>
          <div class="mut" id="cnt" style="margin-bottom:4px"></div>
          <div id="list" tabindex="0" aria-label="曲の一覧"><p id="vmsg" class="mut pad">楽曲データを読み込み中…</p><div id="vsp"></div></div>
        </div>
        <div id="s-diff" hidden>
          <a class="btn g" href="#songs">‹ 曲を探すに戻る</a>
          <div class="card" style="margin-top:12px"><div class="hero" id="dinfo"></div></div>
          <div class="card"><h2>難易度を選ぶ</h2><div id="dlist"></div></div>
        </div>
        <div id="s-chart" hidden>
          <div class="card"><div class="info" id="cinfo"></div>
            <div class="cbar">
              <a class="btn g" id="bk" href="#songs">‹ 難易度選択に戻る</a>
              <button id="goR">拡大表示（別タブ）</button><button id="dlSvg" class="g">SVGで保存</button><button id="dlPng" class="g">PNGで保存</button>
            </div></div>
          <div id="chart"></div>
        </div>
      </section>
      <section id="p-settings" class="pg" hidden>
        <div class="set">
          <div class="card"><h2>表示の設定</h2>
            <div class="fld"><label for="zm">ノーツ間隔（px/拍）<b id="zv"></b></label><input id="zm" type="range" min="16" max="400" /></div>
            <div class="fld"><label for="bpc">1行あたりの小節数</label><select id="bpc"></select><div class="mut" id="bpn"></div></div>
            <div class="fld"><label for="slOpacity">スライドノーツの透明度<b id="slv"></b></label><input id="slOpacity" type="range" min="0" max="100" /></div>
            <div class="fld"><label for="gdOpacity">ガイドノーツの透明度<b id="gdv"></b></label><input id="gdOpacity" type="range" min="0" max="100" /></div>
            <div class="fld"><label><span>ミラー（左右反転）</span><input id="mirror" type="checkbox" style="width:auto" /></label></div>
            <button id="rst" class="g">初期設定に戻す</button>
            <p class="mut">変更は自動で保存され、譜面の表示に反映されます。</p></div>
          <div class="card pvc"><h2>プレビュー（スライドノーツ・ガイドノーツ）</h2><div id="pv"></div><p class="mut" style="margin:8px 0 0">実際の譜面と同じ描画です。ノーツ間隔・透明度・ミラーの変更がすぐに反映されます。</p></div>
        </div>
      </section>
    </main>
    <div id="st" role="status" hidden></div>
    <script>
      'use strict';
      const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      const MASTER='https://sekai-world.github.io/sekai-master-db-diff/',DIFFS=['easy','normal','hard','expert','master','append'];
      const DCOL={easy:'#4fc95b',normal:'#34a9ee',hard:'#f09a1a',expert:'#ec4264',master:'#a94fe0',append:'#ee6fbd'};
      const pad=(n,l)=>String(n).padStart(l,'0');
      const jacket=m=>{const a=m.assetbundleName||'jacket_s_'+pad(m.id,3);return`https://storage.sekai.best/sekai-jp-assets/music/jacket/${a}/${a}.webp`};
      /* ---------- Chart source resolution ----------
         sekai-music-charts は完成SVGを配信し、元データは _01_rip/*.txt。
         _01 のasset3配信も旧ミラーとして順に試す。
      */
      const id4=i=>pad(i,4);
      const susGroups=(id,d)=>[
        [`https://storage.sekai.best/sekai-jp-assets/music/music_score/${id4(id)}_01_rip/${d}.txt`],
        [
          `https://storage.sekai.best/sekai-jp-assets/music/music_score/${id4(id)}_01_rip/${d}.sus`,
          `https://storage.sekai.best/sekai-jp-assets/music/music_score/${id4(id)}_01/${d}.txt`,
          `https://storage.sekai.best/sekai-jp-assets/music/music_score/${id4(id)}_01/${d}.sus`,
          `https://asset3.pjsekai.moe/music/music_score/${id4(id)}_01/${d}.txt`,
          `https://asset3.pjsekai.moe/music/music_score/${id4(id)}_01/${d}.sus`,
          `https://asset3.pjsekai.moe/music/music_score/${id4(id)}_01/${d}`
        ]
      ];
      const susURLs=(id,d)=>susGroups(id,d).flat();
      const svgURLs=(id,d)=>[
        `https://storage.sekai.best/sekai-music-charts/jp/${id4(id)}/${d}.svg`,
        `https://asset3.pjsekai.moe/music/music_score/${id4(id)}_01/${d}.svg`
      ];
      const svgURL=(id,d)=>svgURLs(id,d)[0];
      const isSVG=u=>/\.svg(?:[?#].*)?$/i.test(u);
      const stripBOM=t=>String(t??'').replace(/^\uFEFF/,'');
      const isSUS=t=>{
        const x=stripBOM(t).replace(/\r/g,'');
        return !/^\s*</.test(x)&&/^#(?:BPM[0-9A-Z]{2}|\d{3}(?:02|08|1[0-9A-Z]|3[0-9A-Z]{2}|5[0-9A-Z]|9[0-9A-Z]{2})): /mi.test(x.replace(/:([^\n]*)/g,': $1'));
      };
      const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
      const b36=c=>{const n=parseInt(String(c),36);return Number.isFinite(n)?n:-1};
      function scorePairs(data,measure,warnings,lineNo){
        const d=String(data).toUpperCase(),L=d.length,out=[];
        if(!L)return out;
        if(L%2)warnings.push(`行${lineNo}: データ長が奇数のため末尾1文字を無視しました`);
        for(let i=0;i+1<L;i+=2){
          const v=d.slice(i,i+2);if(v==='00')continue;
          const type=b36(v[0]),width=b36(v[1]);
          if(type<0||width<0){warnings.push(`行${lineNo}: 不正なBase36値「${v}」`);continue}
          /* SUSのタイミングは行データ全体の文字数を分母にした正確な有理数。 */
          const num=measure*L+i,den=L,g=gcd(num,den)||1;
          out.push({v,t:type,w:width,bar:num/den,bk:`${num/g}/${den/g}`});
        }
        return out;
      }
      function parseSUS(text){
        text=stripBOM(text);
        const bpmDef=new Map(),tilDefs=new Map(),ev=[],raw=[],meta={},warnings=[];
        const usedHiSpeedIds=new Set(),usedMeasureSpeedIds=new Set();
        let ticksPerBeat=480,activeHiSpeedId=null,lineNo=0,unhandled=0,seq=0;
        const registerHiSpeedData=()=>{if(activeHiSpeedId!==null)usedHiSpeedIds.add(activeHiSpeedId)};
        for(const l0 of text.split(/\r?\n/)){
          lineNo++;const l=l0.trim();if(!l||l[0]!=='#')continue;
          if(/^#NOSPEED$/i.test(l)){meta.NOSPEED='';activeHiSpeedId=null;continue}
          let m=l.match(/^#([A-Za-z0-9_]+)\s+(.*)$/);
          if(m){
            const key=m[1].toUpperCase(),value=m[2].replace(/^\"|\"$/g,'').trim();meta[key]=value;
            if(key==='REQUEST'){
              const q=value.match(/ticks_per_beat\s+(\d+)/i);if(q&&+q[1]>0)ticksPerBeat=+q[1];
            }else if(key==='HISPEED'){
              const id=b36(value);if(id>=0)activeHiSpeedId=id
            }else if(key==='MEASUREHS'){
              const id=b36(value);if(id>=0)usedMeasureSpeedIds.add(id);
            }
            continue;
          }
          m=l.match(/^#([A-Za-z0-9_]+):\s*(.*)$/);if(!m)continue;
          const h=m[1],d=m[2];let x,base;
          if((x=h.match(/^(\d{3})02$/))){
            const len=Number(d);if(Number.isFinite(len)&&len>0)ev.push({bar:+x[1],len});else warnings.push(`行${lineNo}: 小節長が不正です`);
          }else if((x=h.match(/^BPM([0-9A-Z]{2})$/i))){
            const bpm=Number(d),id=b36(x[1][0])*36+b36(x[1][1]);if(Number.isFinite(bpm)&&bpm>0)bpmDef.set(id,bpm);else warnings.push(`行${lineNo}: BPM定義が不正です`);
          }else if((x=h.match(/^TIL([0-9A-Z]{2})$/i))){
            const id=b36(x[1][0])*36+b36(x[1][1]),def=[];
            const value=d.replace(/^\"|\"$/g,'');
            for(const token of value.split(',')){
              const q=token.trim().match(/^(\d+)\s*['.]\s*(\d+)\s*:\s*([+-]?(?:\d+(?:\.\d*)?|\.\d+))$/);
              if(!q){if(token.trim())warnings.push(`行${lineNo}: TIL定義「${token.trim()}」を解析できません`);continue}
              const measure=+q[1],tick=+q[2],speed=Number(q[3]);
              if(Number.isFinite(speed))def.push({measure,tick,speed});
            }
            tilDefs.set(id,def);
          }else if((x=h.match(/^(\d{3})08$/))){
            scorePairs(d,+x[1],warnings,lineNo).forEach(p=>ev.push({bar:p.bar,bpmId:b36(p.v[0])*36+b36(p.v[1])}));
          }else if((x=h.match(/^(\d{3})1([0-9A-Z])$/i))){
            base={k:'tap',lane:b36(x[2]),ch:null,deco:false};const pairs=scorePairs(d,+x[1],warnings,lineNo);if(pairs.length)registerHiSpeedData();
            pairs.forEach(p=>raw.push({...base,bar:p.bar,bk:p.bk,w:p.w,t:p.t,seq:seq++,lineNo}));
          }else if((x=h.match(/^(\d{3})5([0-9A-Z])$/i))){
            base={k:'dir',lane:b36(x[2]),ch:null,deco:false};const pairs=scorePairs(d,+x[1],warnings,lineNo);if(pairs.length)registerHiSpeedData();
            pairs.forEach(p=>raw.push({...base,bar:p.bar,bk:p.bk,w:p.w,t:p.t,seq:seq++,lineNo}));
          }else if((x=h.match(/^(\d{3})3([0-9A-Z])([0-9A-Z])$/i))||(x=h.match(/^(\d{3})9([0-9A-Z])([0-9A-Z])$/i))){
            const deco=h.charAt(3)==='9';base={k:'sl',lane:b36(x[2]),ch:b36(x[3]),deco};const pairs=scorePairs(d,+x[1],warnings,lineNo);if(pairs.length)registerHiSpeedData();
            pairs.forEach(p=>raw.push({...base,bar:p.bar,bk:p.bk,w:p.w,t:p.t,seq:seq++,lineNo}));
          }else if(/^ATR[0-9A-Z]{2}$/i.test(h)||/^(ATTRIBUTE|NOATTRIBUTE)$/i.test(h)){
            /* ノーツ属性定義は現在の表示対象外。 */
          }else if(/^\d{3}/.test(h)||/^BPM|^TIL/i.test(h)){
            unhandled++;if(unhandled<=8)warnings.push(`行${lineNo}: 未対応の譜面行「${h}」`);
          }
        }
        if(unhandled>8)warnings.push(`ほか${unhandled-8}行の未対応データがあります`);
        ev.forEach(e=>{if(e.bpmId!==undefined){e.bpm=bpmDef.get(e.bpmId);if(e.bpm===undefined)warnings.push(`小節${e.bar.toFixed(4)}: BPM ID ${e.bpmId} の定義がありません`)}});
        /* TIL: measure'tick:speed. A speed definition is only active when
           referenced by HISPEED or MEASUREHS. One measure contains
           (measure length in beats * ticksPerBeat) ticks. */
        const measureLengthAt=measure=>{
          let beats=4;for(const e of ev.filter(v=>v.len).sort((a,b)=>a.bar-b.bar)){if(e.bar<=measure+1e-9)beats=e.len;else break}return beats;
        };
        /* HS(note) と BAR(measure) は同じTILを参照することが多く、同一タイミング・同一速度の
           イベントが2件ずつ生成されて重複表示されていた。小節位置と速度が同じものは1件に統合し、
           HS/BAR の両方で使われている場合は speedMode='both' として「HS/BAR」と表示する。 */
        const speedEvents=new Map(),missingTil=new Set();
        const appendSpeedEvents=(ids,mode)=>{
          for(const id of ids){
            const entries=tilDefs.get(id);
            if(!entries){if(!missingTil.has(id)){missingTil.add(id);warnings.push(`TIL${id.toString(36).toUpperCase().padStart(2,'0')} の速度定義が見つかりません`)}continue}
            for(const entry of entries){
              const bar=entry.measure+entry.tick/(ticksPerBeat*measureLengthAt(entry.measure));
              const key=`${bar.toFixed(8)}|${entry.speed}`,prev=speedEvents.get(key);if(prev){if(prev.speedMode!==mode)prev.speedMode='both';continue}
              const e={bar,speed:entry.speed,eventType:'speed',speedMode:mode};speedEvents.set(key,e);ev.push(e);
            }
          }
        };
        appendSpeedEvents(usedHiSpeedIds,'note');
        appendSpeedEvents(usedMeasureSpeedIds,'measure');
        raw.sort((a,b)=>a.bar-b.bar||a.seq-b.seq);

        /* まず有効レーンを索引化し、同時刻・同じ幅の重なりだけを結合する。 */
        const deleted=new Set(),byBar=new Map(),sameSlot=(a,b)=>a.bk===b.bk&&a.lane===b.lane&&a.w===b.w;
        raw.forEach((n,i)=>{
          if(!(n.lane>=2&&n.lane<14)){
            deleted.add(i);ev.push({bar:n.bar,text:n.lane===0?'SKILL':n.t===1?'FEVER CHANCE!':'SUPER FEVER!!',eventType:'info'});return;
          }
          const a=byBar.get(n.bk)||[];a.push(i);byBar.set(n.bk,a);
        });
        /* 1st pass: directional -> tap */
        raw.forEach((d,i)=>{

          const fin=im=>{IMG.run--;IMG.fly.delete(u);const w=IMG.wait.get(u)||[];IMG.wait.delete(u);
            if(im){IMG.done.set(u,im);w.forEach(el=>{el.src=im.src})}else{IMG.bad.set(u,Date.now());w.forEach(el=>{el.src=PH})}pump()};
          load(u,fin,()=>fin(null));
        }
      }

      /* ---- Home ---- */
      function drawHome(){
        const r=pub(),l=r[0];if(!l)return;
        $('#latest').innerHTML=`<img class="big" data-u="${jacket(l)}" alt=""><div><h3>${esc(l.title)}</h3><div class="mut">${credit(l)}</div><div class="mut">公開日 ${fd(l.publishedAt)} ／ #${l.id}</div><div class="dcs">${dif(l.id).map(d=>chip(l,d)).join('')}</div><a class="btn" href="#songs/${l.id}">譜面を見る</a></div>`;
        $('#recent').innerHTML=r.slice(1,13).map(s=>`<a class="rc" href="#songs/${s.id}"><img data-u="${jacket(s)}" alt=""><b>${esc(s.title)}</b><small>${fd(s.publishedAt)}</small></a>`).join('');
        hydrate($('#latest'),0);hydrate($('#recent'),1);
        $('#stats').innerHTML=`<div><b>${r.length}</b>収録曲</div><div><b>${r.reduce((n,s)=>n+dif(s.id).length,0)}</b>譜面</div><div><b>${fd(l.publishedAt)}</b>最新の公開日</div>`;
      }

      /* ---- Songs: list ---- */
      const q={k:'',sort:'date',d:'master',unit:'all',asc:false};
      const ROW=68,OVER=6,vRows=new Map();let vData=[],vLv=false,vT=0;
      function drawList(){
        const k=q.k.trim().toLowerCase(),lv=q.sort==='level',val=s=>lv?diffs[s.id][q.d].playLevel:(s.publishedAt||0);
        vData=pub().filter(s=>(!k||[s.id,s.title,s.pronunciation,s.lyricist,s.composer,s.arranger].join('\n').toLowerCase().includes(k))&&(q.unit==='all'||(tags[s.id]&&tags[s.id].has(q.unit)))&&(!lv||(diffs[s.id]||{})[q.d]));
        vData.sort((a,b)=>(val(a)-val(b)||(a.publishedAt||0)-(b.publishedAt||0)||a.id-b.id)*(q.asc?1:-1));vLv=lv;
        $('#cnt').textContent=songs.length?`${vData.length}曲`:'';
        const m=vData.length?'':songs.length?'条件に合う曲がありません。検索語やユニットを変えてみてください。':'楽曲データを読み込み中…';
        $('#vmsg').textContent=m;$('#vmsg').hidden=!m;
        $('#vsp').style.height=vData.length*ROW+'px';$('#list').scrollTop=0;
        vRows.forEach(e=>e.remove());vRows.clear();vRender();
      }
      function vRow(i){
        const s=vData[i],a=document.createElement('a');a.className='it';a.href='#songs/'+s.id;a.style.top=i*ROW+'px';
        a.innerHTML=`<img data-u="${jacket(s)}" alt=""><span><b>${esc(s.title)}</b><small>#${s.id} ／ ${fd(s.publishedAt)}</small><small>${credit(s)}</small></span>${vLv?`<i class="lb" style="background:${DCOL[q.d]}">Lv${diffs[s.id][q.d].playLevel}</i>`:''}`;
        return a;
      }
      function vRender(){
        const box=$('#list'),h=box.clientHeight;if(!h||!vData.length)return;
        const t=box.scrollTop,v0=Math.floor(t/ROW),v1=Math.ceil((t+h)/ROW),a=Math.max(0,v0-OVER),b=Math.min(vData.length-1,v1+OVER);
        vRows.forEach((e,i)=>{if(i<a||i>b){e.remove();vRows.delete(i)}});
        for(let i=a;i<=b;i++){const p=i>=v0&&i<v1?2:3;if(vRows.has(i))vRows.get(i).firstChild.dataset.p=p;else{const e=vRow(i);$('#vsp').appendChild(e);vRows.set(i,e);want(e.firstChild,p,1)}}
        pump();
      }
      $('#list').addEventListener('scroll',()=>{vT=vT||requestAnimationFrame(()=>{vT=0;vRender()})},{passive:true});
      addEventListener('resize',vRender);
      const ordLabel=()=>{$('#ord').textContent=q.asc?'昇順 ↑':'降順 ↓';$('#ord').setAttribute('aria-label',q.asc?'昇順（押すと降順に切替）':'降順（押すと昇順に切替）')};
      $('#unit').innerHTML=UNITS.map(([v,n])=>`<option value="${v}">${n}</option>`).join('');
      $('#dsel').innerHTML=DIFFS.map(d=>`<option value="${d}"${d==='master'?' selected':''}>${DN[d]}</option>`).join('');
      $('#q').oninput=e=>{q.k=e.target.value;drawList()};
      $('#unit').onchange=e=>{q.unit=e.target.value;drawList()};
      $('#sort').onchange=e=>{q.sort=e.target.value;$('#dsel').hidden=q.sort!=='level';drawList()};
      $('#dsel').onchange=e=>{q.d=e.target.value;drawList()};
      $('#ord').onclick=()=>{q.asc=!q.asc;ordLabel();drawList()};

      /* ---- Songs: difficulty select / chart ---- */
      function drawDiff(){
        const s=cur;
        $('#dinfo').innerHTML=`<img class="big" data-u="${jacket(s)}" alt=""><div><h3>${esc(s.title)}</h3><div class="mut">${esc(s.pronunciation||'')}</div><div class="mut">${credit(s)}</div><div class="mut">公開日 ${fd(s.publishedAt)} ／ #${s.id}</div></div>`;
        hydrate($('#dinfo'),0);
        $('#dlist').innerHTML=dif(s.id).map(d=>{const o=diffs[s.id][d];return`<a class="dbtn" style="--c:${DCOL[d]}" href="#songs/${s.id}/${d}"><b>${DN[d]}</b><span>Lv ${o.playLevel}</span><small>${o.totalNoteCount.toLocaleString()} notes</small></a>`}).join('')||'<p class="mut">この曲の難易度情報がありません。</p>';
      }
      function drawInfo(){
        const o=diffs[cur.id][curD];
        $('#cinfo').innerHTML=`<img class="jk" data-u="${jacket(cur)}" alt=""><div><h3>${esc(cur.title)}</h3><div class="mut">${credit(cur)}</div><div class="dcs"><span class="dc" style="background:${DCOL[curD]}">${DN[curD]} Lv${o.playLevel}</span><span class="dc nt">総ノーツ数 ${o.totalNoteCount.toLocaleString()}</span><span class="mut">公開日 ${fd(cur.publishedAt)}</span></div></div>`;
        hydrate($('#cinfo'),0);$('#bk').href='#songs/'+cur.id;
      }
      /* 譜面を開いた時の位置合わせ：0小節目（左端の列の一番下）が見える位置にする。
         時間は下から上へ進む。SVGの周囲には余白（R.ml=左, R.mb=下）があり、下の余白はノーツ間隔に比例して
         大きくなるため、単純に「一番下までスクロール」するとノーツ間隔が大きい時に余白しか映らなくなる。
         そこで余白を除いた位置（0小節目の線のすぐ下）が画面の下端に来るよう合わせる。
         z=表示倍率（拡大表示用）。R=null（生成済み画像の表示）の時は従来どおり左下。 */
      const toStart=(box,R,z=1)=>{
        if(!box||!box.clientHeight)return false;
        box.scrollTop=Math.max(0,box.scrollHeight-(R?R.mb*z:0)-box.clientHeight);
        box.scrollLeft=Math.max(0,R?R.ml*z:0);
        return true;
      };
      const toFirst=()=>{
        const b=$('#chart');let on=true;
        ['wheel','touchstart','pointerdown','keydown'].forEach(e=>b.addEventListener(e,()=>{on=false},{once:true,passive:true}));
        const go=()=>{if(on)toStart(b,lastR)};
        go();requestAnimationFrame(go);[120,350,900].forEach(t=>setTimeout(go,t));
      };
      function drawChart(){
        try{const S=parseSUS(sus),R=render(S,cfg.zm,cfg.bpc,0,0,vs());$('#chart').innerHTML=R.svg;lastR=R;dirty=false;toFirst();const o=diffs[cur.id][curD];lastName=cur.title+'_'+curD;songLabel=`${cur.title}-${curD.toUpperCase()} Lv${o.playLevel}`;const sj=cur;songInfo={get jk(){return(IMG.done.get(jacket(sj))||{}).src||jacket(sj)},title:cur.title,diff:curD,level:o.playLevel};st('')}
        catch(e){st('解析エラー: '+e.message);console.error(e)}
      }
      function showSVG(c){
        c=[...new Set(c.filter(Boolean))];let i=0;
        const next=()=>{const u=c[i++];
          if(!u){$('#chart').innerHTML='<div class="msg">譜面を取得できませんでした。通信状況を確認するか、別の難易度でお試しください。</div>';st('');key='';return}
          const im=new Image();im.className='sv';im.alt='譜面';im.referrerPolicy='no-referrer';
          im.onload=()=>{st('生成済みの譜面画像を表示中（この表示では設定の反映・画像保存・拡大表示は使えません）');toFirst()};
          im.onerror=()=>{if(im.isConnected)next()};im.src=u;$('#chart').replaceChildren(im)};
        next();
      }
      async function loadChart(){
        const my=++rid;cancel();sus='';lastR=null;$('#chart').innerHTML='<div class="msg">譜面データを取得中…</div>';st('譜面データを取得中…');
        const{hit}=await fetchSUS(susGroups(cur.id,curD));if(my!==rid)return;
        if(hit&&hit.kind==='sus'){sus=hit.t;drawChart();return}
        showSVG([hit&&hit.u,...svgURLs(cur.id,curD)]);
      }
      const doSave=f=>lastR?saveChart(lastR,f,`${cur.title}_${curD}`):st('保存にはSUSの解析表示が必要です（画像表示では使えません）');
      $('#dlSvg').onclick=()=>doSave('svg');$('#dlPng').onclick=()=>doSave('png');
      $('#goR').onclick=()=>{
       const t=sus;if(!t.trim()||!lastR){st('拡大表示にはSUSの解析が必要です（画像表示では使えません）');return}
       const spacing=cfg.zm,columns=cfg.bpc;
       const w=window.open('','_blank');if(!w){st('ポップアップがブロックされました。許可してください');return}
       try{
        const popupScore=parseSUS(t),sp=loadPrefs().popup||{},cfg={zoom:Math.round(pref(sp.zoom,25,5,100)),spacing:Math.round(pref(sp.spacing,spacing,16,400)),slideOpacity:pref(sp.slideOpacity,vs().slideOpacity,0,1),guideOpacity:pref(sp.guideOpacity,vs().guideOpacity,0,1),mirror:sp.mirror==null?vs().mirror:!!sp.mirror};
        const first=render(popupScore,cfg.spacing,columns,0,0,cfg),tabTitle=esc(songLabel||popupScore.meta.TITLE||'譜面');
        const si=songInfo,songHTML=`<div class="song">${si?`<img src="${esc(si.jk)}" alt="">`:''}<div><b>${esc(si?si.title:(popupScore.meta.TITLE||'譜面'))}</b>${si?`<span class="lv" style="background:${DCOL[si.diff]||'#74829f'}">${esc(si.diff.toUpperCase())}${si.level!=null?` Lv${esc(si.level)}`:''}</span>`:''}</div></div>`;
        w.document.write(`<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${tabTitle}</title>
        <style>
          *{box-sizing:border-box}body{margin:0;background:#101827;color:#e5edf7;font:13px system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column}
          header{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 12px;background:#18263a;border-bottom:1px solid #344b66}
          .song{display:flex;align-items:center;gap:10px;flex:1 1 280px;min-width:0}.song img{width:48px;height:48px;border-radius:8px;flex:none;background:#26364d;box-shadow:0 2px 6px #0006}.song div{min-width:0}.song b{display:block;font-size:15px;line-height:1.35;word-break:break-word}.lv{display:inline-block;margin-top:3px;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;color:#fff}.tools{margin-left:auto}.btns{display:flex;flex-wrap:wrap;gap:8px}button{border:0;border-radius:7px;padding:7px 11px;background:#2fbfae;color:#102033;font-weight:700;cursor:pointer}
          #panel{flex:none;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:10px 14px;background:#1d2c42;border-bottom:1px solid #344b66}
          #panel[hidden]{display:none}.control{min-width:180px;display:flex;flex-direction:column;gap:3px}.control label{font-size:11px;color:#c4d2e4}.control input{width:180px;accent-color:#58d7c4}
          .value{font-weight:700;color:#fff;margin-left:5px}#chartBox{flex:1;min-height:0;overflow:auto;padding:12px;background:#111827}
          #chartBox svg{display:block;max-width:none;height:auto}.hint{font-size:10px;color:#91a6bf}
        </style>
        <header>${songHTML}<div class="tools"><button id="toggle">設定を隠す</button></div></header>
        <section id="panel">
          <div class="control"><label>拡大倍率 <span class="value" id="zoomValue">${cfg.zoom}%</span></label><input id="zoom" type="range" min="5" max="100" step="1" value="${cfg.zoom}"></div>
          <div class="control"><label>ノーツ間隔（px/拍） <span class="value" id="spacingValue">${cfg.spacing}</span></label><input id="spacing" type="range" min="16" max="400" step="1" value="${cfg.spacing}"></div>
          <div class="control"><label>スライドノーツ透明度 <span class="value" id="slideValue">${Math.round(cfg.slideOpacity*100)}%</span></label><input id="slideOpacity" type="range" min="0" max="100" step="1" value="${Math.round(cfg.slideOpacity*100)}"></div>
          <div class="control"><label>ガイドノーツ透明度 <span class="value" id="guideValue">${Math.round(cfg.guideOpacity*100)}%</span></label><input id="guideOpacity" type="range" min="0" max="100" step="1" value="${Math.round(cfg.guideOpacity*100)}"></div>
        <div class="control"><label><input id="mirror" type="checkbox" style="width:auto" ${cfg.mirror?'checked':''}> ミラー（左右反転）</label></div>
        <div class="control"><label>画像保存</label><div class="btns"><button id="dlSvg">SVGで保存</button><button id="dlPng">PNGで保存</button></div><span class="hint" id="dlMsg"></span></div>
        </section><main id="chartBox">${first.svg}</main>
        <script>
          const cfg={zoom:${cfg.zoom},spacing:${cfg.spacing},slideOpacity:${cfg.slideOpacity},guideOpacity:${cfg.guideOpacity},mirror:${!!cfg.mirror}};
          const $=id=>document.getElementById(id);
          function applyZoom(){const svg=$('chartBox').querySelector('svg');if(!svg)return;const base=Number(svg.getAttribute('width'))||1;svg.style.width=(base*cfg.zoom/100)+'px';svg.style.height='auto';$('zoomValue').textContent=cfg.zoom+'%'}
          function persist(){if(typeof window.__savePrefs==='function')window.__savePrefs({...cfg})}function requestRender(){persist();if(typeof window.__renderChartFromParent==='function')window.__renderChartFromParent({...cfg})}
          $('zoom').addEventListener('input',e=>{cfg.zoom=Math.min(100,Math.max(5,Number(e.target.value)||25));applyZoom();persist()});
          $('spacing').addEventListener('input',e=>{cfg.spacing=Number(e.target.value);$('spacingValue').textContent=cfg.spacing;requestRender()});
          $('slideOpacity').addEventListener('input',e=>{cfg.slideOpacity=Number(e.target.value)/100;$('slideValue').textContent=e.target.value+'%';requestRender()});
          $('guideOpacity').addEventListener('input',e=>{cfg.guideOpacity=Number(e.target.value)/100;$('guideValue').textContent=e.target.value+'%';requestRender()});
          $('mirror').addEventListener('change',e=>{cfg.mirror=e.target.checked;requestRender()});
          $('toggle').addEventListener('click',()=>{const panel=$('panel');panel.hidden=!panel.hidden;$('toggle').textContent=panel.hidden?'設定を表示':'設定を隠す'});
          ['Svg','Png'].forEach(function(k){$('dl'+k).addEventListener('click',function(){if(typeof window.__saveFromParent==='function')window.__saveFromParent(k.toLowerCase(),{...cfg})})});
          window.__applyZoom=applyZoom;
        <\/script></html>`);
        w.document.close();
        let shown=first; /* いま表示中の描画結果（0小節目の位置＝余白 ml/mb を求めるのに使う） */
        w.__renderChartFromParent=(next)=>{
          const updated=render(popupScore,next.spacing,columns,0,0,next),box=w.document.getElementById('chartBox');
          /* スクロール位置は「0小節目の線のすぐ下」からの距離で保つ。SVG下端基準だと、ノーツ間隔で下の余白が変わった時に
             0小節目が画面外へ流れてしまう。先頭付近を見ている場合は、間隔を変えても0小節目が見えたままになる。 */
          if(!box)return;const z=(+next.zoom||25)/100,fb=box.scrollHeight-shown.mb*z-box.scrollTop-box.clientHeight;box.innerHTML=updated.svg;shown=updated;
          const spacingLabel=w.document.getElementById('spacingValue');if(spacingLabel)spacingLabel.textContent=next.spacing;if(typeof w.__applyZoom==='function')w.__applyZoom();box.scrollTop=Math.max(0,box.scrollHeight-updated.mb*z-box.clientHeight-fb);
          if(typeof w.__applyZoom==='function')w.__applyZoom();
        };
        if(typeof w.__applyZoom==='function')w.__applyZoom();
       {const b0=w.document.getElementById('chartBox');if(b0){let on=true;const go=()=>{if(on)toStart(b0,first,(+w.document.getElementById('zoom').value||cfg.zoom)/100)};['wheel','touchstart','pointerdown','keydown'].forEach(e=>b0.addEventListener(e,()=>{on=false},{once:true,passive:true}));go();w.requestAnimationFrame(go);[120,350,900].forEach(t=>w.setTimeout(go,t))}} w.__savePrefs=c=>savePrefs({popup:{zoom:c.zoom,spacing:c.spacing,slideOpacity:c.slideOpacity,guideOpacity:c.guideOpacity,mirror:!!c.mirror}});
        const popupName=lastName;
        w.__saveFromParent=(fmt,next)=>saveChart(render(popupScore,next.spacing,columns,0,0,next),fmt,popupName,m=>{const e=w.document.getElementById('dlMsg');if(e)e.textContent=m},next.zoom,w);
       }catch(e){w.close();st('拡大表示の生成エラー: '+e.message);console.error(e)}
      };

      /* ---- Settings (live preview uses the real renderer) ---- */
      const PV=`#REQUEST "ticks_per_beat 480"
#BPM01: 120
#00008: 01
#000330: 13000000
#000350: 00003300
#001360: 23000000
#000981: 12000000
#000991: 00003200
#001971: 22000000`;
      let PVS=null;
      function drawPv(){
        PVS=PVS||parseSUS(PV);
        const R=render(PVS,cfg.zm,2,0,0,{...vs(),noMargin:true}),pb=$('#pv');
        pb.innerHTML=R.svg.replace(/\bid="([^"]+)"/g,'id="pv-$1"').replace(/url\(#([^)]+)\)/g,'url(#pv-$1)').replace(/href="#([^"]+)"/g,'href="#pv-$1"');
        toStart(pb,R); /* プレビューも実譜面と同じく0小節目（左下）から表示 */
      }
      function sync(){
        $('#zm').value=cfg.zm;$('#bpc').value=cfg.bpc;$('#slOpacity').value=cfg.sl;$('#gdOpacity').value=cfg.gd;$('#mirror').checked=cfg.mirror;
        $('#zv').textContent=cfg.zm;$('#slv').textContent=cfg.sl+'%';$('#gdv').textContent=cfg.gd+'%';
        $('#bpn').textContent=`例：128小節の曲は約${Math.ceil(128/cfg.bpc)}列に分けて横に並べます`;
      }
      const changed=p=>{sync();drawPv();dirty=true;savePrefs({main:cfg,...(p?{popup:{...(loadPrefs().popup||{}),...p}}:{})})};
      $('#bpc').innerHTML=BPCS.map(n=>`<option>${n}</option>`).join('');
      $('#zm').oninput=e=>{cfg.zm=+e.target.value;changed({spacing:cfg.zm})};
      $('#bpc').onchange=e=>{cfg.bpc=+e.target.value;changed()};
      $('#slOpacity').oninput=e=>{cfg.sl=+e.target.value;changed({slideOpacity:cfg.sl/100})};
      $('#gdOpacity').oninput=e=>{cfg.gd=+e.target.value;changed({guideOpacity:cfg.gd/100})};
      $('#mirror').onchange=e=>{cfg.mirror=e.target.checked;changed({mirror:cfg.mirror})};
      $('#rst').onclick=()=>{cfg={...DEF};changed({spacing:cfg.zm,slideOpacity:cfg.sl/100,guideOpacity:cfg.gd/100,mirror:cfg.mirror})};

      /* ---- Side menu (all screen sizes) ---- */
      const nav=$('#nav');
      function setNav(o){nav.classList.toggle('open',o);nav.inert=!o;$('#scrim').hidden=!o;$('#menu').setAttribute('aria-expanded',o);if(o)nav.querySelector('a').focus()}
      $('#menu').onclick=()=>setNav(true);
      $('#navx').onclick=$('#scrim').onclick=()=>{setNav(false);$('#menu').focus()};
      document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(nav.classList.contains('open')){setNav(false);$('#menu').focus()}});

      /* ---- Router: #home / #songs / #songs/ID / #songs/ID/DIFF / #settings ---- */
      const TITLES={home:'ホーム',songs:'曲を探す',settings:'設定'};
      function route(){
        const[p0,id,d]=location.hash.slice(1).split('/'),p=TITLES[p0]?p0:'home';
        if(!$('#p-songs').hidden&&!$('#s-list').hidden)listY=$('#list').scrollTop;
        setNav(false);
        $$('.pg').forEach(e=>e.hidden=e.id!=='p-'+p);
        $$('#nav a').forEach(a=>a.dataset.p===p?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
        $('#ttl').textContent=TITLES[p];document.title=TITLES[p]+' | プロセカ 譜面ビューア';
        if(p==='settings'){sync();drawPv()}
        if(p==='songs'){
          const s=songs.find(x=>x.id==id),dd=s&&diffs[s.id]&&diffs[s.id][d]?d:null,stg=s?(dd?'chart':'diff'):'list';
          ['list','diff','chart'].forEach(n=>$('#s-'+n).hidden=n!==stg);
          if(stg==='list'){$('#list').scrollTop=listY;vRender()}else window.scrollTo(0,0);
          if(stg==='diff'){cur=s;drawDiff()}
          if(stg==='chart'){cur=s;curD=dd;drawInfo();const k=s.id+'/'+dd;if(k!==key){key=k;loadChart()}else if(dirty&&sus)drawChart();else toFirst()}
        }
      }
      addEventListener('hashchange',route);

      /* ---- Init ---- */
      $('#legend').innerHTML=LEG;ordLabel();sync();route();
      (async()=>{
        st('楽曲データを取得中…');
        try{
          const[m,d,t]=await Promise.all([jget('musics.json'),jget('musicDifficulties.json'),jget('musicTags.json').catch(()=>[])]);
          songs=m;d.forEach(x=>(diffs[x.musicId]??={})[x.musicDifficulty]=x);t.forEach(x=>(tags[x.musicId]??=new Set()).add(x.musicTag));
          $('#unit').disabled=!t.length;st('');drawList();route();drawHome();
        }catch(e){st('楽曲データを取得できません。通信状況を確認して再読み込みしてください')}
      })();
    </script>
  </body>
</html>
