<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>プロセカ 譜面ビューア</title>
    <style>
      :root{color-scheme:light;--ink:#27324a;--mut:#74829f;--acc:#2fbfae;--ln:#dde8f6}
      *{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;color:var(--ink);background:linear-gradient(135deg,#eaf7ff,#fff3fa) fixed}
      header{display:flex;gap:16px;align-items:center;padding:10px 18px;background:#fff;border-bottom:3px solid var(--acc)}
      h1{font-size:18px;margin:0}#st{color:var(--mut);font-size:12px}
      main{display:grid;grid-template-columns:340px 1fr;gap:14px;padding:14px;height:calc(100vh - 58px)}
      aside{overflow:auto;display:flex;flex-direction:column;gap:12px}
      section.p{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:12px;box-shadow:0 2px 8px #6aa0d014}
      h2{font-size:13px;margin:0 0 8px;color:var(--acc)}
      input,textarea,select{width:100%;padding:7px 9px;border:1px solid var(--ln);border-radius:8px;font:inherit;background:#fbfdff}
      textarea{height:90px;font:11px/1.3 monospace;resize:vertical}
      button{cursor:pointer;border:0;border-radius:8px;padding:7px 12px;background:var(--acc);color:#fff;font:inherit;font-weight:700}
      button.g{background:#e8f1fb;color:var(--ink)}.row{display:flex;gap:6px;margin:6px 0}.row input{flex:1}
      #list{max-height:250px;overflow:auto;margin-top:6px}
      .it{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;color:inherit;font-weight:400;padding:4px;border-radius:8px}
      .it:hover,.it.on{background:#e9f8f5}.it img{width:38px;height:38px;border-radius:6px;background:#eef}.it span{min-width:0}
      .it b,.it small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it small,.mut{color:var(--mut);font-size:11px}
      #card{display:flex;gap:10px}#card img{width:84px;height:84px;border-radius:10px;box-shadow:0 2px 8px #0002}
      #card h3{margin:0;font-size:15px}#dif{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
      .dc{border-radius:999px;padding:3px 10px;font-size:12px;color:#fff;opacity:.55}.dc.on{opacity:1;box-shadow:0 0 0 3px #fff,0 0 0 5px currentColor}
      #view{display:flex;flex-direction:column;min-width:0;background:#fff;border:1px solid var(--ln);border-radius:12px;overflow:hidden}
      #bar{padding:8px 12px;border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
      .ch{background:#eef6ff;border-radius:999px;padding:2px 10px;font-size:12px}.ok{background:#dcf7e8}.ng{background:#fff0d6}
      #chart{flex:1;overflow:auto;background:#f7fbff}#legend{padding:4px 12px;border-bottom:1px solid var(--ln)}
      #msg{padding:30px;color:var(--mut)}
      #chart img.sv{display:block;height:auto;background:#fff}
      @media(max-width:860px){main{grid-template-columns:1fr;height:auto}#chart{height:70vh}}
    </style>
  </head>
  <body>
    <header>
      <h1>♪ プロセカ 譜面ビューア <small style="font-size:11px;color:#74829f;font-weight:500">v2.0 / SUS再構成エンジン</small></h1>
      <span id="st">楽曲データ取得中…</span>
    </header>
    <main>
      <aside>
        <section class="p">
          <h2>① 楽曲を選ぶ</h2>
          <input id="q" placeholder="曲名・読み・作詞作曲編曲・ID で検索" />
          <div id="list"></div>
        </section>
        <section class="p" id="sel" hidden="">
          <div id="card">
            <img id="jk" alt="" />
            <div>
              <h3 id="tt"></h3>
              <div class="mut" id="pr"></div>
              <div class="mut" id="cr"></div>
            </div>
          </div>
          <div id="dif"></div>
        </section>
        <section class="p">
          <h2>② 譜面データ（SUS）</h2>
          <div class="mut">URL（曲と難易度の選択で自動入力）</div>
          <div class="row">
            <input id="url" placeholder="SUS .txt/.sus または生成済み .svg のURL" />
            <button id="goU">読込</button>
          </div>
          <div class="mut">取得方法</div>
          <select id="src">
            <option value="auto" selected="">自動（元SUS優先→生成SVGへ切替）</option>
            <option value="sus">SUS（txt）のみ</option>
            <option value="svg">生成済みSVG（sekai-music-charts）</option>
          </select>
          <div class="mut">またはテキストを貼り付け</div>
          <textarea
            id="txt"
            placeholder="#BPM01: 120
#00008: 01
#00012: 11000000 …"
          ></textarea>
          <div class="row">
            <button id="goT">貼り付けから描画</button>
            <button id="smp" class="g">サンプル</button>
          </div>
        </section>
        <section class="p">
          <h2>③ 表示</h2>
          <div class="mut">
            拡大（1拍あたり px）：
            <b id="zv">36</b>
          </div>
          <input id="zm" type="range" min="16" max="400" value="36" />
          <div class="mut" style="margin-top:6px">1列あたりの小節数</div>
          <select id="bpc">
            <option>4</option>
            <option selected="">8</option>
            <option>12</option>
            <option>16</option>
          </select>
          <div class="mut" style="margin-top:10px">
            拡大表示（別タブ）：全体を、上の「1列あたりの小節数」で区切った列を横に並べ、「拡大」の倍率で表示（タブ内の倍率スライダーでも拡縮できます）
          </div>
          <button id="goR" style="margin-top:6px">拡大表示を別タブで開く</button>
        </section>
      </aside>
      <section id="view">
        <div id="bar"></div>
        <div id="legend"></div>
        <div id="chart"><div id="msg">左で曲と難易度を選ぶか、SUSを貼り付けてください。</div></div>
      </section>
    </main>
    <script>
      'use strict';
      const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      const MASTER='https://sekai-world.github.io/sekai-master-db-diff/',DIFFS=['easy','normal','hard','expert','master','append'];
      const DCOL={easy:'#4fc95b',normal:'#34a9ee',hard:'#f09a1a',expert:'#ec4264',master:'#a94fe0',append:'#ee6fbd'};
      const pad=(n,l)=>String(n).padStart(l,'0');
      const jacket=m=>{const a=m.assetbundleName||'jacket_s_'+pad(m.id,3);return`https://storage.sekai.best/sekai-jp-assets/music/jacket/${a}/${a}.png`};
      /* ---------- Chart source resolution ----------
         sekai-music-charts は完成SVGを配信し、元データは _01_rip/*.txt。
         _01 のasset3配信も旧ミラーとして順に試す。
      */
      const id4=i=>pad(i,4);
      const susGroups=(id,d)=>[
        [`https://storage.sekai.best/sekai-jp-assets/music/music_score/${id4(id)}_01_rip/${d}.txt`],
        [
          `https://storage.sekai.best/sekai-jp-assets/music/music_score/${id4(id)}_01_rip/${d}.sus`,
          `https://storage.sekai.best/sekai-jp-assets/music/music_score/${id4(id)}_01/${d}.txt`,
          `https://storage.sekai.best/sekai-jp-assets/music/music_score/${id4(id)}_01/${d}.sus`,
          `https://asset3.pjsekai.moe/music/music_score/${id4(id)}_01/${d}.txt`,
          `https://asset3.pjsekai.moe/music/music_score/${id4(id)}_01/${d}.sus`,
          `https://asset3.pjsekai.moe/music/music_score/${id4(id)}_01/${d}`
        ]
      ];
      const susURLs=(id,d)=>susGroups(id,d).flat();
      const svgURLs=(id,d)=>[
        `https://storage.sekai.best/sekai-music-charts/jp/${id4(id)}/${d}.svg`,
        `https://asset3.pjsekai.moe/music/music_score/${id4(id)}_01/${d}.svg`
      ];
      const svgURL=(id,d)=>svgURLs(id,d)[0];
      const isSVG=u=>/\.svg(?:[?#].*)?$/i.test(u);
      const stripBOM=t=>String(t??'').replace(/^\uFEFF/,'');
      const isSUS=t=>{
        const x=stripBOM(t).replace(/\r/g,'');
        return !/^\s*</.test(x)&&/^#(?:BPM[0-9A-Z]{2}|\d{3}(?:02|08|1[0-9A-Z]|3[0-9A-Z]{2}|5[0-9A-Z]|9[0-9A-Z]{2})): /mi.test(x.replace(/:([^\n]*)/g,': $1'));
      };
      const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
      const b36=c=>{const n=parseInt(String(c),36);return Number.isFinite(n)?n:-1};
      function scorePairs(data,measure,warnings,lineNo){
        const d=String(data).replace(/\s+/g,'').toUpperCase(),L=d.length,out=[];
        if(!L)return out;
        if(L%2)warnings.push(`行${lineNo}: データ長が奇数のため末尾1文字を無視しました`);
        for(let i=0;i+1<L;i+=2){
          const v=d.slice(i,i+2);if(v==='00')continue;
          const type=b36(v[0]),width=b36(v[1]);
          if(type<0||width<0){warnings.push(`行${lineNo}: 不正なBase36値「${v}」`);continue}
          /* SUSのタイミングは行データ全体の文字数を分母にした正確な有理数。 */
          const num=measure*L+i,den=L,g=gcd(num,den)||1;
          out.push({v,t:type,w:width,bar:num/den,bk:`${num/g}/${den/g}`});
        }
        return out;
      }
      function parseSUS(text){
        text=stripBOM(text);
        const bpmDef=new Map(),ev=[],raw=[],meta={},warnings=[];
        let lineNo=0,unhandled=0,seq=0;
        for(const l0 of text.split(/\r?\n/)){
          lineNo++;const l=l0.trim();if(!l||l[0]!=='#')continue;
          let m=l.match(/^#([A-Za-z0-9_]+)\s+(.*)$/);
          if(m){meta[m[1].toUpperCase()]=m[2].replace(/^\"|\"$/g,'');continue}
          m=l.match(/^#([A-Za-z0-9_]+):\s*(.*)$/);if(!m)continue;
          const h=m[1],d=m[2];let x,base;
          if((x=h.match(/^(\d{3})02$/))){
            const len=Number(d);if(Number.isFinite(len)&&len>0)ev.push({bar:+x[1],len});else warnings.push(`行${lineNo}: 小節長が不正です`);
          }else if((x=h.match(/^BPM([0-9A-Z]{2})$/i))){
            const bpm=Number(d),id=b36(x[1][0])*36+b36(x[1][1]);if(Number.isFinite(bpm)&&bpm>0)bpmDef.set(id,bpm);else warnings.push(`行${lineNo}: BPM定義が不正です`);
          }else if((x=h.match(/^(\d{3})08$/))){
            scorePairs(d,+x[1],warnings,lineNo).forEach(p=>ev.push({bar:p.bar,bpmId:b36(p.v[0])*36+b36(p.v[1])}));
          }else if((x=h.match(/^(\d{3})1([0-9A-Z])$/i))){
            base={k:'tap',lane:b36(x[2]),ch:null,deco:false};
            scorePairs(d,+x[1],warnings,lineNo).forEach(p=>raw.push({...base,bar:p.bar,bk:p.bk,w:p.w,t:p.t,seq:seq++,lineNo}));
          }else if((x=h.match(/^(\d{3})5([0-9A-Z])$/i))){
            base={k:'dir',lane:b36(x[2]),ch:null,deco:false};
            scorePairs(d,+x[1],warnings,lineNo).forEach(p=>raw.push({...base,bar:p.bar,bk:p.bk,w:p.w,t:p.t,seq:seq++,lineNo}));
          }else if((x=h.match(/^(\d{3})3([0-9A-Z])([0-9A-Z])$/i))||(x=h.match(/^(\d{3})9([0-9A-Z])([0-9A-Z])$/i))){
            const deco=h.charAt(3)==='9';base={k:'sl',lane:b36(x[2]),ch:b36(x[3]),deco};
            scorePairs(d,+x[1],warnings,lineNo).forEach(p=>raw.push({...base,bar:p.bar,bk:p.bk,w:p.w,t:p.t,seq:seq++,lineNo}));
          }else if(/^TIL[0-9A-Z]{2}$/i.test(h)||/^ATR[0-9A-Z]{2}$/i.test(h)||/^(ATTRIBUTE|NOATTRIBUTE|HISPEED|NOSPEED|MEASUREHS)$/i.test(h)){
            /* 表示位置を変えない属性行。現在のビューアでは描画対象外。 */
          }else if(/^\d{3}/.test(h)||/^BPM/i.test(h)){
            unhandled++;if(unhandled<=8)warnings.push(`行${lineNo}: 未対応の譜面行「${h}」`);
          }
        }
        if(unhandled>8)warnings.push(`ほか${unhandled-8}行の未対応データがあります`);
        ev.forEach(e=>{if(e.bpmId!==undefined){e.bpm=bpmDef.get(e.bpmId);if(e.bpm===undefined)warnings.push(`小節${e.bar.toFixed(4)}: BPM ID ${e.bpmId} の定義がありません`)}});
        raw.sort((a,b)=>a.bar-b.bar||a.seq-b.seq);

        /* まず有効レーンを索引化し、同時刻・同じ幅の重なりだけを結合する。 */
        const deleted=new Set(),byBar=new Map(),sameSlot=(a,b)=>a.bk===b.bk&&a.lane===b.lane&&a.w===b.w;
        raw.forEach((n,i)=>{
          if(!(n.lane>=2&&n.lane<14)){
            deleted.add(i);ev.push({bar:n.bar,text:n.lane===0?'SKILL':n.t===1?'FEVER CHANCE!':'SUPER FEVER!!'});return;
          }
          const a=byBar.get(n.bk)||[];a.push(i);byBar.set(n.bk,a);
        });
        /* 1st pass: directional -> tap */
        raw.forEach((d,i)=>{
          if(deleted.has(i)||d.k!=='dir')return;
          for(const j of byBar.get(d.bk)||[]){const t=raw[j];if(!deleted.has(j)&&t.k==='tap'&&sameSlot(t,d)){deleted.add(j);d.tap=t}}
        });
        /* 2nd pass: slide/guide -> tap + directional */
        raw.forEach((s,i)=>{
          if(deleted.has(i)||s.k!=='sl')return;s.head=s;
          if(s.t===5||s.t===0)return;
          for(const j of byBar.get(s.bk)||[]){const t=raw[j];if(!deleted.has(j)&&t.k==='tap'&&sameSlot(t,s)){deleted.add(j);s.tap=t}}
          for(const j of byBar.get(s.bk)||[]){const d=raw[j];if(!deleted.has(j)&&d.k==='dir'&&sameSlot(d,s)){deleted.add(j);s.dir=d;if(d.tap)s.tap=d.tap}}
        });
        /* 3rd pass: same channel + same guide/slide family forms a path. */
        const slideIndexes=raw.map((n,i)=>({n,i})).filter(({n,i})=>!deleted.has(i)&&n.k==='sl');
        for(const {n:s,i} of slideIndexes){
          if(!s.head)s.head=s;if(s.t===2){s.next=null;continue}
          const next=slideIndexes.find(({n,i:j})=>j>i&&n.ch===s.ch&&n.deco===s.deco);
          if(next){s.next=next.n;next.n.head=s.head}
        }
        const active=raw.filter((_,i)=>!deleted.has(i));
        const chainStarts=active.filter(n=>n.k==='sl'&&n.t===1);
        let orphanStarts=0,orphanEnds=0,orphanDirections=0;
        active.filter(n=>n.k==='dir').forEach(n=>{if(!n.tap)orphanDirections++});
        chainStarts.forEach(start=>{let p=start,seen=new Set([p]);while(p.next&&!seen.has(p.next)){p=p.next;seen.add(p)}if(p.t!==2)orphanStarts++});
        active.filter(n=>n.k==='sl'&&n.t===2).forEach(end=>{const hasStart=chainStarts.some(start=>{let p=start,seen=new Set();while(p&&!seen.has(p)){if(p===end)return true;seen.add(p);p=p.next}return false});if(!hasStart)orphanEnds++});
        if(orphanStarts)warnings.push(`${orphanStarts}本のスライド経路で終点を確認できません`);
        if(orphanEnds)warnings.push(`${orphanEnds}個のスライド終点に始点がありません`);
        if(orphanDirections)warnings.push(`${orphanDirections}個の方向指定が同位置のノーツに結合されていません`);
        const unsupported=active.filter(n=>n.k==='tap'&&!([1,2,3,4,5,6,7,8].includes(n.t))||n.k==='sl'&&!([0,1,2,3,5].includes(n.t))||n.k==='dir'&&!([1,2,3,4,5,6].includes(n.t))).length;
        if(unsupported)warnings.push(`${unsupported}個の未定義ノーツ種別を検出しました`);
        return{
          meta,ev:ev.sort((a,b)=>a.bar-b.bar),notes:active,allNotes:raw,
          stats:{raw:raw.length,active:active.length,attached:deleted.size,chains:chainStarts.length,orphanStarts,orphanEnds,orphanDirections,unsupported,warnings}
        };
      }
      const crit=n=>n.k==='tap'?[2,6,8].includes(n.t):n.k==='dir'?!!(n.tap&&crit(n.tap)):!!((n.tap&&crit(n.tap))||(n.dir&&crit(n.dir))||(n.head&&n.head!==n&&crit(n.head)));
      const trend=n=>n.k==='tap'?[5,6].includes(n.t):n.k==='dir'?!!(n.tap&&trend(n.tap)):!!((n.tap&&trend(n.tap))||(n.dir&&trend(n.dir)));
      const none=n=>n.k==='tap'?[7,8].includes(n.t):n.k==='sl'?!!(n.tap&&none(n.tap)):false;
      const isPath=s=>s.t===0?false:s.t!==3?true:!!s.dir||(!s.tap&&!s.dir);
      /* ---------- ノーツ描画（ゲーム内デザインを再現したSVG） ---------- */
      const LW=20,PL=46,PR=64,COLW=PL+12*LW+PR,TOP=30;
      const C={tap:['#eaf0ff','#9c8be8','#8fa4f7'],long:['#e5fbee','#4fd9a0','#4fd9a0'],flick:['#ffeaf0','#ee7a98','#f4a3b6'],crit:['#fff7da','#f1b42e','#f6c84a'],dmg:['#efe5fa','#6f43a8','#8d63c4'],unknown:['#ffe0e0','#dc5555','#b82e2e']};
      const body=(x,y,w,k,a=1,h=14)=>{const c=C[k];return`<g opacity="${a}"><rect x="${x-2}" y="${y-h/2-2}" width="${w+4}" height="${h+4}" rx="8" fill="${c[1]}" opacity=".25"/><rect x="${x}" y="${y-h/2}" width="${w}" height="${h}" rx="6" fill="${c[0]}" stroke="${c[1]}" stroke-width="2"/>${k==='tap'&&h>8?`<rect x="${x+2}" y="${y+h/2-3.5}" width="${w-4}" height="3" rx="1.5" fill="#43dcf3"/>`:''}${h>8?`<rect x="${x+3}" y="${y-3}" width="4" height="6" rx="1" fill="${c[2]}"/><rect x="${x+w-7}" y="${y-3}" width="4" height="6" rx="1" fill="${c[2]}"/>`:''}</g>`};
      const gem=(x,y,k)=>{const f=k==='crit'?['#f8d24f','#d9981a']:k==='flick'?['#f598b1','#d85a82']:['#6fe3b8','#27b185'];return`<polygon points="${x},${y-7} ${x+6.5},${y} ${x},${y+7} ${x-6.5},${y}" fill="${f[0]}" stroke="${f[1]}" stroke-width="1.5"/><polygon points="${x},${y-7} ${x-6.5},${y} ${x},${y}" fill="#fff" opacity=".8"/>`};
      const arrow=(cx,y,w,angle,k)=>{const f=k==='crit'?['#f7c21f','#e29408']:['#f0728f','#d93f66'],a=8+Math.min(w,6)*3.2,b=7+Math.min(w,6)*1.6;return`<g transform="translate(${cx} ${y-9}) rotate(${angle})"><polygon points="${-a},0 0,${-b} ${a},0 ${a},6 0,${6-b} ${-a},6" fill="${f[0]}" stroke="${f[1]}" stroke-width="1.6" stroke-linejoin="round"/></g>`};
      const trc=(x,y,w,cr,fl,d=0)=>{const c=cr?['#fff3c2','#e0a21a']:fl?['#ffe3ec','#ee7a98']:['#dff7ec','#27b185'];return`<rect x="${x}" y="${y-4}" width="${w}" height="8" rx="4" fill="${c[0]}" stroke="${c[1]}" stroke-width="2"/>${gem(x+w/2,y,cr?'crit':fl?'flick':'long')}${fl?`<path d="M${x+w/2-7} ${y-9}l7-6 7 6" fill="none" stroke="${cr?'#ee4a6e':'#d93f66'}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" transform="rotate(${d} ${x+w/2} ${y})"/>`:''}`};
      /* SUS directional: 1=上, 2=下, 3/4=左上/右上, 5/6=左下/右下 */
      const dirOf=n=>{const d=n&&n.k==='dir'?n:n&&n.dir;return!d?null:({1:0,2:180,3:-45,4:45,5:-135,6:135}[d.t]??0)};
      /* ---------- レイアウト & SVG生成 ---------- */
      function render(S,ppb,BPC,R0=0,RN=0){
       const{notes,ev}=S;let maxBar=0;notes.forEach(n=>maxBar=Math.max(maxBar,n.bar));ev.forEach(e=>maxBar=Math.max(maxBar,e.bar));
       const total=Math.floor(maxBar+1e-9)+1,len=[],cum=[0];let cl=4,ei=0;const lens=ev.filter(e=>e.len).sort((a,b)=>a.bar-b.bar);
       for(let b=0;b<=total;b++){while(ei<lens.length&&lens[ei].bar<=b)cl=lens[ei++].len;len[b]=cl;cum[b+1]=cum[b]+cl}
       const cb=B=>{const m=Math.min(Math.floor(B+1e-9),total);return cum[m]+(B-m)*len[m]},m0=Math.min(Math.max(0,Math.floor(R0)),total-1),m1=RN?Math.min(total,m0+Math.floor(RN)):total,nc=Math.max(1,Math.ceil((m1-m0)/BPC));

      async function decodeResponse(response){
       let buf=await response.arrayBuffer();
       if(buf.byteLength>2&&new Uint8Array(buf)[0]===0x1f&&new Uint8Array(buf)[1]===0x8b&&'DecompressionStream'in window){

      async function fetchSUS(groups){
