<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>プロセカ 譜面ビューア</title>
    <style>
      :root{color-scheme:light;--ink:#27324a;--mut:#74829f;--acc:#2fbfae;--ln:#dde8f6}
      *{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;color:var(--ink);background:linear-gradient(135deg,#eaf7ff,#fff3fa) fixed}
      header{display:flex;gap:16px;align-items:center;padding:10px 18px;background:#fff;border-bottom:3px solid var(--acc)}
      h1{font-size:18px;margin:0}#st{color:var(--mut);font-size:12px}
      main{display:grid;grid-template-columns:340px 1fr;gap:14px;padding:14px;height:calc(100vh - 58px)}
      aside{overflow:auto;display:flex;flex-direction:column;gap:12px}
      section.p{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:12px;box-shadow:0 2px 8px #6aa0d014}
      h2{font-size:13px;margin:0 0 8px;color:var(--acc)}
      input,textarea,select{width:100%;padding:7px 9px;border:1px solid var(--ln);border-radius:8px;font:inherit;background:#fbfdff}
      textarea{height:90px;font:11px/1.3 monospace;resize:vertical}
      button{cursor:pointer;border:0;border-radius:8px;padding:7px 12px;background:var(--acc);color:#fff;font:inherit;font-weight:700}
      button.g{background:#e8f1fb;color:var(--ink)}.row{display:flex;gap:6px;margin:6px 0}.row input{flex:1}
      #list{max-height:250px;overflow:auto;margin-top:6px}
      .it{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;color:inherit;font-weight:400;padding:4px;border-radius:8px}
      .it:hover,.it.on{background:#e9f8f5}.it img{width:38px;height:38px;border-radius:6px;background:#eef}.it span{min-width:0}
      .it b,.it small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it small,.mut{color:var(--mut);font-size:11px}
      #card{display:flex;gap:10px}#card img{width:84px;height:84px;border-radius:10px;box-shadow:0 2px 8px #0002}
      #card h3{margin:0;font-size:15px}#dif{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
      .dc{border-radius:999px;padding:3px 10px;font-size:12px;color:#fff;opacity:.55}.dc.on{opacity:1;box-shadow:0 0 0 3px #fff,0 0 0 5px currentColor}
      #view{display:flex;flex-direction:column;min-width:0;background:#fff;border:1px solid var(--ln);border-radius:12px;overflow:hidden}
      #bar{padding:8px 12px;border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
      .ch{background:#eef6ff;border-radius:999px;padding:2px 10px;font-size:12px}.ok{background:#dcf7e8}.ng{background:#fff0d6}
      #chart{flex:1;overflow:auto;background:#f7fbff}#legend{padding:4px 12px;border-bottom:1px solid var(--ln)}
      #msg{padding:30px;color:var(--mut)}
      #chart img.sv{display:block;height:auto;background:#fff}
      @media(max-width:860px){main{grid-template-columns:1fr;height:auto}#chart{height:70vh}}
    </style>
  </head>
  <body>
    <header>
      <h1>♪ プロセカ 譜面ビューア</h1>
      <span id="st">楽曲データ取得中…</span>
    </header>
    <main>
      <aside>
        <section class="p">
          <h2>① 楽曲を選ぶ</h2>
          <input id="q" placeholder="曲名・読み・作詞作曲編曲・ID で検索" />
          <div id="list"></div>
        </section>
        <section class="p" id="sel" hidden="">
          <div id="card">
            <img id="jk" alt="" />
            <div>
              <h3 id="tt"></h3>
              <div class="mut" id="pr"></div>
              <div class="mut" id="cr"></div>
            </div>
          </div>
          <div id="dif"></div>
        </section>
        <section class="p">
          <h2>② 譜面データ（SUS）</h2>
          <div class="mut">URL（曲と難易度の選択で自動入力）</div>
          <div class="row">
            <input id="url" placeholder="https://…/master.txt または …/master.svg" />
            <button id="goU">読込</button>
          </div>
          <div class="mut">取得方法</div>
          <select id="src">
            <option value="auto" selected="">自動（SUS取得→失敗時はSVG画像に切替）</option>
            <option value="sus">SUS（txt）のみ</option>
            <option value="svg">SVG画像（pjsekai.moe）</option>
          </select>
          <div class="mut">またはテキストを貼り付け</div>
          <textarea
            id="txt"
            placeholder="#BPM01: 120
#00008: 01
#00012: 11000000 …"
          ></textarea>
          <div class="row">
            <button id="goT">貼り付けから描画</button>
            <button id="smp" class="g">サンプル</button>
          </div>
        </section>
        <section class="p">
          <h2>③ 表示</h2>
          <div class="mut">
            拡大（1拍あたり px）：
            <b id="zv">36</b>
          </div>
          <input id="zm" type="range" min="16" max="400" value="36" />
          <div class="mut" style="margin-top:6px">1列あたりの小節数</div>
          <select id="bpc">
            <option>4</option>
            <option selected="">8</option>
            <option>12</option>
            <option>16</option>
          </select>
          <div class="mut" style="margin-top:10px">
            拡大表示（別タブ）：全体を、上の「1列あたりの小節数」で区切った列を横に並べ、「拡大」の倍率で表示（タブ内の倍率スライダーでも拡縮できます）
          </div>
          <button id="goR" style="margin-top:6px">拡大表示を別タブで開く</button>
        </section>
      </aside>
      <section id="view">
        <div id="bar"></div>
        <div id="legend"></div>
        <div id="chart"><div id="msg">左で曲と難易度を選ぶか、SUSを貼り付けてください。</div></div>
      </section>
    </main>
    <script>
      'use strict';
      const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      const MASTER='https://sekai-world.github.io/sekai-master-db-diff/',DIFFS=['easy','normal','hard','expert','master','append'];
      const DCOL={easy:'#4fc95b',normal:'#34a9ee',hard:'#f09a1a',expert:'#ec4264',master:'#a94fe0',append:'#ee6fbd'};
      const pad=(n,l)=>String(n).padStart(l,'0');
      const jacket=m=>{const a=m.assetbundleName||'jacket_s_'+pad(m.id,3);return`https://storage.sekai.best/sekai-jp-assets/music/jacket/${a}/${a}.png`};
      /* SUSの取得先（ミラーを足す場合は SUSBASES に追記）とSVG画像URL */
      const id4=i=>pad(i,4),SUSBASES=['https://storage.sekai.best/sekai-jp-assets/music/music_score/','https://asset3.pjsekai.moe/music/music_score/'],SVGBASE='https://asset3.pjsekai.moe/music/music_score/';
      const susURLs=(id,d)=>SUSBASES.flatMap(b=>['.txt','.sus',''].map(e=>`${b}${id4(id)}_01/${d}${e}`)),svgURL=(id,d)=>`${SVGBASE}${id4(id)}_01/${d}.svg`;
      const isSVG=u=>/\.svg(?:[?#].*)?$/i.test(u),isSUS=t=>!/^\s*</.test(t)&&/^#(?:BPM\w\w|\d{3}\w{2,3}):/mi.test(t);
      /* ---------- SUS parser (pjsekai.scores と同じ解釈) ---------- */
      const gcd=(a,b)=>b?gcd(b,a%b):a;
      function pairs(d,m){const n=Math.floor(d.length/2),o=[];for(let i=0;i<n;i++){const v=d.substr(2*i,2);if(v==='00')continue;const g=gcd(i,n);o.push({v,bar:m+i/n,bk:m+':'+i/g+'/'+n/g})}return o}
      function parseSUS(text){
       const bpmDef={},ev=[],raw=[],meta={};let m,x;
       for(const l0 of text.split(/\r?\n/)){const l=l0.trim();if(l[0]!=='#')continue;
        if(m=l.match(/^#(\w+)\s+(.*)$/)){meta[m[1].toUpperCase()]=m[2].replace(/^"|"$/g,'');continue}
        if(!(m=l.match(/^#(\w+):\s*(.*)$/)))continue;const h=m[1],d=m[2];
        if(x=h.match(/^(\d{3})02$/))ev.push({bar:+x[1],len:parseFloat(d)});
        else if(x=h.match(/^BPM(..)$/i))bpmDef[parseInt(x[1],36)]=parseFloat(d);
        else if(x=h.match(/^(\d{3})08$/))pairs(d,+x[1]).forEach(p=>ev.push({bar:p.bar,bpmId:parseInt(p.v,36)}));
        else if(x=h.match(/^(\d{3})1(.)$/))pairs(d,+x[1]).forEach(p=>raw.push({k:'tap',bar:p.bar,bk:p.bk,lane:parseInt(x[2],36),w:parseInt(p.v[1],36),t:parseInt(p.v[0],36)}));
        else if(x=h.match(/^(\d{3})5(.)$/))pairs(d,+x[1]).forEach(p=>raw.push({k:'dir',bar:p.bar,bk:p.bk,lane:parseInt(x[2],36),w:parseInt(p.v[1],36),t:parseInt(p.v[0],36)}));
        else if(x=h.match(/^(\d{3})([39])(.)(.)$/))pairs(d,+x[1]).forEach(p=>raw.push({k:'sl',bar:p.bar,bk:p.bk,lane:parseInt(x[3],36),w:parseInt(p.v[1],36),t:parseInt(p.v[0],36),ch:parseInt(x[4],36),deco:x[2]==='9'}));
       }
       ev.forEach(e=>{if(e.bpmId!==undefined)e.bpm=bpmDef[e.bpmId]});
       raw.sort((a,b)=>a.bar-b.bar);
       const del=new Set(),by={},same=(a,b)=>a.lane===b.lane&&a.w===b.w;
       raw.forEach((n,i)=>{if(!(n.lane>=2&&n.lane<14)){del.add(i);ev.push({bar:n.bar,text:n.lane===0?'SKILL':n.t===1?'FEVER CHANCE!':'SUPER FEVER!!'});return}(by[n.bk]??=[]).push(i)});
       raw.forEach((d,i)=>{if(del.has(i)||d.k!=='dir')return;for(const j of by[d.bk]){const t=raw[j];if(!del.has(j)&&t.k==='tap'&&same(t,d)){del.add(j);d.tap=t}}});
       raw.forEach((s,i)=>{if(del.has(i)||s.k!=='sl')return;s.head=s;if(s.t===5||s.t===0)return;
        for(const j of by[s.bk]){const t=raw[j];if(!del.has(j)&&t.k==='tap'&&same(t,s)){del.add(j);s.tap=t}}
        for(const j of by[s.bk]){const d=raw[j];if(!del.has(j)&&d.k==='dir'&&same(d,s)){del.add(j);s.dir=d;if(d.tap)s.tap=d.tap}}
        });
       /* 経路の連結：ID(ch)ごとに時系列で処理。同時刻に終点と別の始点が同じIDを使っていても「終点→始点」の順で扱う */
       {const op={};raw.map((n,i)=>[n,i]).filter(([n,i])=>!del.has(i)&&n.k==='sl').sort((a,b)=>a[0].bar-b[0].bar||(a[0].t===1)-(b[0].t===1)||a[1]-b[1]).forEach(([n])=>{const key=n.ch+(n.deco?'d':'s');if(n.t===1){op[key]=n;return}const q=op[key];if(!q)return;q.next=n;n.head=q.head;if(n.t===2)delete op[key];else op[key]=n})}
       return{meta,ev:ev.sort((a,b)=>a.bar-b.bar),notes:raw.filter((_,i)=>!del.has(i))};
      }
      const crit=n=>n.k==='tap'?[2,6,8].includes(n.t):n.k==='dir'?!!(n.tap&&crit(n.tap)):!!((n.tap&&crit(n.tap))||(n.dir&&crit(n.dir))||(n.head!==n&&crit(n.head)));
      const trend=n=>n.k==='tap'?[5,6].includes(n.t):n.k==='dir'?!!(n.tap&&trend(n.tap)):!!((n.tap&&trend(n.tap))||(n.dir&&trend(n.dir)));
      const none=n=>n.k==='tap'?[7,8].includes(n.t):n.k==='sl'?!!(n.tap&&none(n.tap)):false;
      const isPath=s=>s.t===0?false:s.t!==3?true:!!s.dir||(!s.tap&&!s.dir);
      /* ---------- ノーツ描画（ゲーム内デザインを再現したSVG） ---------- */
      const LW=20,PL=46,PR=64,COLW=PL+12*LW+PR,TOP=30;
      const C={tap:['#eaf0ff','#9c8be8','#8fa4f7'],long:['#e5fbee','#4fd9a0','#4fd9a0'],flick:['#ffeaf0','#ee7a98','#f4a3b6'],crit:['#fff7da','#f1b42e','#f6c84a'],dmg:['#efe5fa','#6f43a8','#8d63c4']};
      const body=(x,y,w,k,a=1,h=14)=>{const c=C[k];return`<g opacity="${a}"><rect x="${x-2}" y="${y-h/2-2}" width="${w+4}" height="${h+4}" rx="8" fill="${c[1]}" opacity=".25"/><rect x="${x}" y="${y-h/2}" width="${w}" height="${h}" rx="6" fill="${c[0]}" stroke="${c[1]}" stroke-width="2"/>${k==='tap'&&h>8?`<rect x="${x+2}" y="${y+h/2-3.5}" width="${w-4}" height="3" rx="1.5" fill="#43dcf3"/>`:''}${h>8?`<rect x="${x+3}" y="${y-3}" width="4" height="6" rx="1" fill="${c[2]}"/><rect x="${x+w-7}" y="${y-3}" width="4" height="6" rx="1" fill="${c[2]}"/>`:''}</g>`};
      const gem=(x,y,k)=>{const f=k==='crit'?['#f8d24f','#d9981a']:k==='flick'?['#f598b1','#d85a82']:['#6fe3b8','#27b185'];return`<polygon points="${x},${y-7} ${x+6.5},${y} ${x},${y+7} ${x-6.5},${y}" fill="${f[0]}" stroke="${f[1]}" stroke-width="1.5"/><polygon points="${x},${y-7} ${x-6.5},${y} ${x},${y}" fill="#fff" opacity=".8"/>`};
      const arrow=(cx,y,w,dir,k)=>{const f=k==='crit'?['#f7c21f','#e29408']:['#f0728f','#d93f66'],a=8+Math.min(w,6)*3.2,b=7+Math.min(w,6)*1.6;return`<g transform="translate(${cx+dir*LW/3} ${y-9}) rotate(${dir*28})"><polygon points="${-a},0 0,${-b} ${a},0 ${a},6 0,${6-b} ${-a},6" fill="${f[0]}" stroke="${f[1]}" stroke-width="1.6" stroke-linejoin="round"/></g>`};
      const trc=(x,y,w,cr,fl,d=0)=>{const c=cr?['#fff3c2','#e0a21a']:fl?['#ffe3ec','#ee7a98']:['#dff7ec','#27b185'];return`<rect x="${x}" y="${y-4}" width="${w}" height="8" rx="4" fill="${c[0]}" stroke="${c[1]}" stroke-width="2"/>${gem(x+w/2,y,cr?'crit':fl?'flick':'long')}${fl?`<path d="M${x+w/2-7} ${y-9}l7-6 7 6" fill="none" stroke="${cr?'#ee4a6e':'#d93f66'}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" transform="rotate(${d*28} ${x+w/2} ${y})"/>`:''}`};
      /* 方向: 1,2=上 / 3,5=左 / 4,6=右（5,6は左右へ広がるワイドフリックで使われる）。未知の種別も矢印は必ず出す */
      const dirOf=n=>{const d=n.k==='dir'?n:n.dir;return!d?null:d.t===3||d.t===5?-1:d.t===4||d.t===6?1:0};
      /* ---------- レイアウト & SVG生成 ---------- */
      function render(S,ppb,BPC,R0=0,RN=0){
       const{notes,ev}=S;let maxBar=0;notes.forEach(n=>maxBar=Math.max(maxBar,n.bar));ev.forEach(e=>maxBar=Math.max(maxBar,e.bar));
       const total=Math.floor(maxBar+1e-9)+1,len=[],cum=[0];let cl=4,ei=0;const lens=ev.filter(e=>e.len).sort((a,b)=>a.bar-b.bar);
       for(let b=0;b<=total;b++){while(ei<lens.length&&lens[ei].bar<=b)cl=lens[ei++].len;len[b]=cl;cum[b+1]=cum[b]+cl}
       const cb=B=>{const m=Math.min(Math.floor(B+1e-9),total);return cum[m]+(B-m)*len[m]},m0=Math.min(Math.max(0,Math.floor(R0)),total-1),m1=RN?Math.min(total,m0+Math.floor(RN)):total,nc=Math.max(1,Math.ceil((m1-m0)/BPC));
       let colH=0;for(let c=0;c<nc;c++)colH=Math.max(colH,(cb(Math.min(m0+(c+1)*BPC,m1))-cb(m0+c*BPC))*ppb);
       const bot=TOP+colH,H=bot+26,Y=(c,B)=>bot-(cb(B)-cb(m0+c*BPC))*ppb,X=n=>PL+(n.lane-2)*LW,col=n=>Math.max(0,Math.min(nc-1,Math.floor((n.bar-m0)/BPC+1e-9)));
       /* ロング（スライド）の経路 */
       const chains=[];notes.filter(n=>n.k==='sl'&&n.t===1).forEach(s=>{let a=s;const segs=[],gems=[];while(a.t!==2&&a.next){let b=a.next;const mid=[];for(;;){if(b.t===3)mid.push(b);if(isPath(b)||!b.next)break;b=b.next}segs.push([a,b]);gems.push(...mid);a=b}if(segs.length)chains.push({s,segs,gems,c0:s.bar,c1:segs[segs.length-1][1].bar})});
       const cnt={tap:0,crit:0,flick:0,hold:0,relay:0,trace:0,dmg:0};let combo=0;const cols=Array.from({length:nc},()=>({g:[],p:[],n:[],m:[],a:[],t:[]}));
       chains.forEach(ch=>{const cr=crit(ch.s);for(let c=Math.max(0,Math.floor((ch.c0-m0)/BPC+1e-9));c<=Math.min(nc-1,Math.floor((ch.c1-m0)/BPC+1e-9));c++){let L='',R='';ch.segs.forEach(([a,b],i)=>{const y0=Y(c,a.bar),y1=Y(c,b.bar),d=(y1-y0)/3,l0=X(a),r0=l0+a.w*LW,l1=X(b),r1=l1+b.w*LW;L+=(i?'':`M${l0} ${y0}`)+`C${l0} ${y0+d} ${l1} ${y0+2*d} ${l1} ${y1}`;R=`C${r1} ${y0+2*d} ${r0} ${y0+d} ${r0} ${y0}`+R;if(i===ch.segs.length-1)R=`L${r1} ${y1}`+R});cols[c].p.push(`<path d="${L+R}Z" fill="${cr?'#fcefb4':'#bff5da'}" opacity=".78"/>`)}
        ch.gems.forEach(m=>{if(none(m)||m.deco||m.bar<m0-1e-9||m.bar>m1+1e-9)return;const c=col(m),seg=ch.segs.find(([a,b])=>a.bar<=m.bar&&m.bar<=b.bar)||ch.segs[0],[a,b]=seg,y0=Y(c,a.bar),y1=Y(c,b.bar),ym=Y(c,m.bar),f=y1===y0?0:(ym-y0)/(y1-y0),s=f*f*(3-2*f),xa=X(a)+a.w*LW/2,xb=X(b)+b.w*LW/2;{const xc=xa+(xb-xa)*s,wi=(a.w+(b.w-a.w)*s)*LW-2,cm=crit(m);cols[c].a.push(trend(m)?trc(xc-wi/2,ym,wi,cm,false):gem(xc,ym,cm?'crit':'long'))}})});
       notes.forEach(n=>{if(n.deco||none(n)||n.bar<m0-1e-9||n.bar>m1+1e-9)return;const c=col(n),y=Y(c,n.bar),x=X(n)+1,w=n.w*LW-2,cr=crit(n),tr=trend(n),k=n.k,d=dirOf(n);let kind;
        if(k==='tap'){if(n.t===4){kind='dmg';cnt.dmg++}else if(tr){kind=cr?'crit':'tap';cnt.trace++;combo++}else{kind=cr?'crit':'tap';cnt[cr?'crit':'tap']++;combo++}}
        else if(k==='dir'){kind=cr?'crit':'flick';if(tr)cnt.trace++;else cnt.flick++;combo++}
        else{if(n.t===5||n.t===0)return;if(n.t===3){cnt.relay++;combo++;if(tr)cnt.trace++;return}
         combo++;if(n.t===1)cnt.hold++;
         kind=cr?'crit':n.t===2&&n.dir?'flick':'long';if(tr)cnt.trace++;else if(n.dir&&n.t===2)cnt.flick++}
        const fl=k==='dir'||(k==='sl'&&n.t===2&&!!n.dir);if(tr)cols[c].a.push(trc(x,y,w,cr,fl,fl&&d||0));else cols[c].n.push(body(x,y,w,kind));
        if(d!==null&&!tr&&(k==='dir'||(k==='sl'&&n.t===2)))cols[c].a.push(arrow(X(n)+n.w*LW/2,y,n.w,d,cr?'crit':'flick'))});
       /* 列ごとに組み立て */
       let out='';const cs=[];for(let c=0;c<nc;c++){const b0=m0+c*BPC,b1=Math.min(b0+BPC,m1),o=cols[c],ox=c*COLW;let g='';
        for(let i=0;i<12;i++)g+=`<rect x="${PL+i*LW}" y="${TOP}" width="${LW}" height="${colH}" fill="${i%2?'#eef5fd':'#f8fbff'}"/>`;
        for(let i=0;i<=12;i++)g+=`<line x1="${PL+i*LW}" x2="${PL+i*LW}" y1="${TOP}" y2="${bot}" stroke="#cfdcf0" stroke-width="${i%12?1:1.5}"/>`;
        for(let b=b0;b<=b1;b++){const y=Y(c,b);g+=`<line x1="${PL-4}" x2="${PL+12*LW}" y1="${y}" y2="${y}" stroke="#9db4d6" stroke-width="1.6"/>`;if(b<b1||b===m1)g+=`<text x="${PL-8}" y="${y+4}" text-anchor="end" font-size="11" font-weight="700" fill="#5b7194">${b}</text>`;
         if(b<b1)for(let k=1;k<len[b];k++){const yy=Y(c,b+k/len[b]);g+=`<line x1="${PL}" x2="${PL+12*LW}" y1="${yy}" y2="${yy}" stroke="#dbe6f5" stroke-width="1"/>`}}
        ev.forEach(e=>{if(e.bar<b0||e.bar>=b1+(c===nc-1?1:0)||(!e.bpm&&!e.text))return;const y=Y(c,e.bar);if(e.bpm)g+=`<text x="${PL+12*LW+6}" y="${y-3}" font-size="11" font-weight="700" fill="#d98a00">♩${+(+e.bpm).toFixed(2)}</text>`;if(e.text)g+=`<text x="${PL+12*LW+6}" y="${y+12}" font-size="10" font-weight="700" fill="${e.text==='SKILL'?'#2fa6e8':e.text[0]==='F'?'#ee4a6e':'#a94fe0'}">${e.text}</text>`});
        const inner=`<clipPath id="k${c}"><rect x="0" y="${TOP}" width="${COLW}" height="${colH}"/></clipPath>${g}<g clip-path="url(#k${c})">${o.p.join('')}</g>${o.n.reverse().join('')}${o.a.reverse().join('')}<text x="${PL}" y="16" font-size="11" fill="#74829f">小節 ${b0}–${b1-1}</text>`;cs.push(inner);out+=`<g transform="translate(${ox} 0)">${inner}</g>`}
       return{svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${nc*COLW}" height="${H}" viewBox="0 0 ${nc*COLW} ${H}" font-family="system-ui,sans-serif">${out}</svg>`,cnt,combo,total,cs,w:COLW,h:H};
      }
      /* ---------- UI ---------- */
      let songs=[],diffs={},cur=null,curD=null,auto='';
      const st=t=>$('#st').textContent=t,jget=u=>fetch(MASTER+u).then(r=>{if(!r.ok)throw 0;return r.json()});
      const LEG=(()=>{const f=(w,k,dr)=>`<svg width="${w*LW+20}" height="34"><g transform="translate(10 0)">${body(1,24,w*LW-2,k)}${dr===undefined?'':arrow(w*LW/2,24,w,dr,k==='crit'?'crit':'flick')}</g></svg>`;
       return[['タップ',f(2,'tap')],['クリティカル',f(2,'crit')],['フリック',f(2,'flick',0)],['ロング',f(2,'long')],['中継点',`<svg width="30" height="34"><g>${gem(15,20,'long')}</g></svg>`],['トレース',`<svg width="46" height="34">${trc(4,20,38,0,0)}</svg>`],['フリックトレース',`<svg width="46" height="34">${trc(4,22,38,0,1)}</svg>`],['クリティカルトレース',`<svg width="46" height="34">${trc(4,20,38,1,0)}</svg>`],['クリティカルフリックトレース',`<svg width="46" height="34">${trc(4,22,38,1,1)}</svg>`],['ダメージ',f(2,'dmg')]].map(([n,s])=>`<span style="display:inline-flex;align-items:center;font-size:11px;margin-right:6px">${s}${n}</span>`).join('')})();
      $('#legend').innerHTML=LEG;
      function drawList(){const k=$('#q').value.trim().toLowerCase(),hit=songs.filter(s=>!k||[s.id,s.title,s.pronunciation,s.lyricist,s.composer,s.arranger].join('\n').toLowerCase().includes(k));
       $('#list').innerHTML=hit.slice(0,120).map(s=>`<button class="it ${cur&&cur.id===s.id?'on':''}" data-id="${s.id}"><img loading="lazy" src="${jacket(s)}" alt=""><span><b>${esc(s.title)}</b><small>#${s.id} ／ ${esc(s.composer||'')}</small></span></button>`).join('')+(hit.length>120?`<p class="mut">他 ${hit.length-120} 件… 検索で絞り込んでください</p>`:'')}
      function pick(id){cur=songs.find(s=>s.id==id);$('#sel').hidden=false;$('#jk').src=jacket(cur);$('#tt').textContent=cur.title;$('#pr').textContent=cur.pronunciation||'';
       $('#cr').textContent=`作詞 ${cur.lyricist||'-'} ／ 作曲 ${cur.composer||'-'} ／ 編曲 ${cur.arranger||'-'}`;const ds=diffs[id]||{};
       $('#dif').innerHTML=DIFFS.filter(d=>ds[d]).map(d=>`<span class="dc" data-d="${d}" style="background:${DCOL[d]};color:#fff"><button style="all:unset;cursor:pointer">${d.toUpperCase()} Lv${ds[d].playLevel}・${ds[d].totalNoteCount}</button></span>`).join('')||'<span class="mut">難易度情報なし</span>';
       drawList();const first=DIFFS.filter(d=>ds[d]).pop();if(first)setDiff(first)}
      let rid=0,view='sus',cancel=()=>{};
      function setDiff(d){curD=d;document.querySelectorAll('.dc').forEach(e=>e.classList.toggle('on',e.dataset.d===d));auto=$('#src').value==='svg'?svgURL(cur.id,d):susURLs(cur.id,d)[0];$('#url').value=auto;loadURL()}
      /* SVG画像表示：<img>はCORSの影響を受けないので、txtが取れない場合の保険になる */
      const zoomSVG=()=>{const i=document.querySelector('#chart img.sv');if(i)i.style.width=+$('#zm').value/36*100+'%'};
      function showSVG(u,note){view='svg';$('#url').value=u;const img=new Image();img.className='sv';img.alt='譜面';img.referrerPolicy='no-referrer';
       img.onload=()=>img.isConnected&&st(note||'SVG画像を表示しました（ノーツ解析は行いません）');
       img.onerror=()=>img.isConnected&&st('SVG画像を取得できませんでした（URL違い／未配信の可能性）。ブラウザで直接開いて確認してください');
       img.src=u;$('#chart').replaceChildren(img);zoomSVG();st('SVG画像を読み込み中…');
       $('#bar').innerHTML=`<span class="ch">SVG画像表示</span><a class="ch" href="${esc(u)}" target="_blank" rel="noopener">元のSVGを開く</a>`}
      /* 候補URLを並列取得し、最初に正しいSUSを返したものを採用（各15秒でタイムアウト） */
      async function fetchSUS(urls){const ctl=[],fails=[];cancel=()=>ctl.forEach(c=>c.abort());
       try{const hit=await Promise.any(urls.map(async u=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);ctl.push(c);
         try{let r;try{r=await fetch(u,{signal:c.signal,credentials:'omit',referrerPolicy:'no-referrer'})}catch(e){fails.push('通信/CORS/時間切れ');throw e}
          if(!r.ok){fails.push('HTTP '+r.status);throw 0}
          const x=await r.text();if(!isSUS(x)){fails.push('SUS以外');throw 0}
          return{t:x,u}}finally{clearTimeout(t)}}));
        ctl.forEach(c=>c.abort());return{hit,fails}}catch(e){return{hit:null,fails}}}
      async function loadURL(){const u=$('#url').value.trim();if(!u)return;
       if(!/^https?:\/\//i.test(u)){st('URLは http:// または https:// で始めてください');return}
       const my=++rid;cancel();const mode=$('#src').value,isAuto=u===auto&&cur&&curD;
       if(isSVG(u)){showSVG(u);return}
       st('譜面を取得中…');
       const{hit,fails}=await fetchSUS(isAuto?susURLs(cur.id,curD):[u]);if(my!==rid)return;
       if(hit){$('#url').value=hit.u;$('#txt').value=hit.t;draw(hit.t);return}
       if(isAuto&&mode==='auto'){showSVG(svgURL(cur.id,curD),'SUSを取得できなかったためSVG画像を表示しています（CORS制限の可能性）。ノーツ解析・列数変更は使えません');return}
       const tl=[...fails.reduce((m,w)=>m.set(w,(m.get(w)||0)+1),new Map())].map(([w,n])=>`${w}×${n}`).join('・');
       st(`取得できませんでした（${tl||'不明'}）。URL違い／CORS制限の可能性。「取得方法」でSVG画像を選ぶか、ブラウザで開いて保存→貼り付けも可`)}
      function draw(text){view='sus';try{const S=parseSUS(text),R=render(S,+$('#zm').value,+$('#bpc').value),o=cur&&curD&&diffs[cur.id]&&diffs[cur.id][curD],c=R.cnt;
       const sum=c.tap+c.crit+c.flick+c.hold+c.relay+c.trace;
       $('#bar').innerHTML=[['タップ',c.tap],['クリティカル',c.crit],['フリック',c.flick],['ロング',c.hold],['中継点',c.relay],['トレース',c.trace],['ダメージ',c.dmg]].map(([n,v])=>`<span class="ch">${n} <b>${v}</b></span>`).join('')+`<span class="ch">小節 <b>${R.total}</b></span>`+(o?`<span class="ch ${o.totalNoteCount===R.combo?'ok':'ng'}">解析コンボ数 <b>${R.combo}</b> ／ 公式 ${o.totalNoteCount}</span>`:`<span class="ch">コンボ数(推定) <b>${R.combo}</b></span>`);
       $('#chart').innerHTML=R.svg;st(`描画しました（ノーツ ${S.notes.length}）`)}catch(e){st('解析エラー: '+e.message);console.error(e)}}
      $('#list').onclick=e=>{const b=e.target.closest('.it');if(b)pick(b.dataset.id)};
      $('#dif').onclick=e=>{const s=e.target.closest('.dc');if(s)setDiff(s.dataset.d)};
      $('#q').oninput=drawList;$('#goU').onclick=loadURL;$('#goT').onclick=()=>draw($('#txt').value);
      $('#zm').oninput=()=>{$('#zv').textContent=$('#zm').value;if(view==='svg')zoomSVG()};
      $('#goR').onclick=()=>{const t=$('#txt').value;if(!t.trim()||view==='svg'){st('拡大表示にはSUSの解析が必要です（SVG画像表示では使えません）');return}
       const z=+$('#zm').value,n=+$('#bpc').value,w=window.open('','_blank');if(!w){st('ポップアップがブロックされました。許可してください');return}
       try{const R=render(parseSUS(t),z,n),T=`拡大表示（全${R.total}小節・${n}小節/列・${z}px/拍）`;
        /* 最初のページと同じく、1列あたりの小節数ごとの列を横に並べる（はみ出す分は横スクロール） */
        w.document.write(`<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${T}</title><body style="margin:0;background:#f7fbff;font:13px system-ui;color:#27324a"><div style="padding:8px 14px;background:#fff;border-bottom:2px solid #2fbfae;display:flex;gap:14px;align-items:center;flex-wrap:wrap">${T}<label>表示倍率 <input id="s" type="range" min="50" max="300" value="100" style="width:160px;vertical-align:middle"> <b id="v">100%</b></label></div><div id="c" style="overflow:auto;height:calc(100vh - 44px);padding:12px">${R.svg}</div><script>const s=document.querySelector("#c svg"),w0=+s.getAttribute("width");document.querySelector("#s").oninput=e=>{s.style.width=w0*e.target.value/100+"px";s.style.height="auto";document.querySelector("#v").textContent=e.target.value+"%"}<\/script>`);w.document.close()}catch(e){w.close();st('解析エラー: '+e.message)}};
      $('#zm').onchange=$('#bpc').onchange=()=>{if(view==='svg')zoomSVG();else if($('#txt').value.trim())draw($('#txt').value)};
      $('#src').onchange=()=>{if(cur&&curD)setDiff(curD)};
      $('#smp').onclick=()=>{$('#txt').value=SAMPLE;draw(SAMPLE)};
      const SAMPLE=`#TITLE "SAMPLE"
      #REQUEST "ticks_per_beat 480"
      #BPM01: 120
      #BPM02: 150
      #00008: 01
      #00408: 02
      #00602: 3
      #00012: 11000000
      #00014: 00120000
      #00017: 00001100
      #00019: 00000021
      #00115: 12000000
      #00155: 12000000
      #00119: 00001200
      #00159: 00003200
      #0011c: 00000012
      #0015c: 00000042
      #002340: 12000000
      #002350: 00003200
      #003350: 22000000
      #00355: 12000000
      #00419: 22000000
      #004390: 12000000
      #0043a0: 00005200
      #0053c0: 22000000
      #00512: 00005100
      #00513: 00006100
      #00514: 00004100
      #00610: 11000000
      #00811: 11000000
      #01011: 21000000`;
      (async()=>{try{const[m,d]=await Promise.all([jget('musics.json'),jget('musicDifficulties.json')]);songs=m.sort((a,b)=>b.id-a.id);d.forEach(x=>(diffs[x.musicId]??={})[x.musicDifficulty]=x);st(`楽曲 ${songs.length} 件を読み込みました`);drawList()}catch(e){st('楽曲リストを取得できません（SUSの貼り付けは利用できます）')}})();
    </script>
  </body>
</html>
