<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>プロセカ 譜面ビューア</title>
<style>
:root{color-scheme:light;--ink:#27324a;--mut:#74829f;--acc:#2fbfae;--ln:#dde8f6}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,"Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;color:var(--ink);background:linear-gradient(135deg,#eaf7ff,#fff3fa) fixed}
header{display:flex;gap:16px;align-items:center;padding:10px 18px;background:#fff;border-bottom:3px solid var(--acc)}
h1{font-size:18px;margin:0}#st{color:var(--mut);font-size:12px}
main{display:grid;grid-template-columns:340px 1fr;gap:14px;padding:14px;height:calc(100vh - 58px)}
aside{overflow:auto;display:flex;flex-direction:column;gap:12px}
section.p{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:12px;box-shadow:0 2px 8px #6aa0d014}
h2{font-size:13px;margin:0 0 8px;color:var(--acc)}
input,textarea,select{width:100%;padding:7px 9px;border:1px solid var(--ln);border-radius:8px;font:inherit;background:#fbfdff}
textarea{height:90px;font:11px/1.3 monospace;resize:vertical}
button{cursor:pointer;border:0;border-radius:8px;padding:7px 12px;background:var(--acc);color:#fff;font:inherit;font-weight:700}
button.g{background:#e8f1fb;color:var(--ink)}.row{display:flex;gap:6px;margin:6px 0}.row input{flex:1}
#list{max-height:250px;overflow:auto;margin-top:6px}
.it{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;color:inherit;font-weight:400;padding:4px;border-radius:8px}
.it:hover,.it.on{background:#e9f8f5}.it img{width:38px;height:38px;border-radius:6px;background:#eef}.it span{min-width:0}
.it b,.it small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it small,.mut{color:var(--mut);font-size:11px}
#card{display:flex;gap:10px}#card img{width:84px;height:84px;border-radius:10px;box-shadow:0 2px 8px #0002}
#card h3{margin:0;font-size:15px}#dif{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dc{border-radius:999px;padding:3px 10px;font-size:12px;color:#fff;opacity:.55}.dc.on{opacity:1;box-shadow:0 0 0 3px #fff,0 0 0 5px currentColor}
#view{display:flex;flex-direction:column;min-width:0;background:#fff;border:1px solid var(--ln);border-radius:12px;overflow:hidden}
#bar{padding:8px 12px;border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ch{background:#eef6ff;border-radius:999px;padding:2px 10px;font-size:12px}.ok{background:#dcf7e8}.ng{background:#fff0d6}
#chart{flex:1;overflow:auto;background:#f7fbff}#chart .remote-svg{display:block;width:auto;height:auto;max-width:none}#legend{padding:4px 12px;border-bottom:1px solid var(--ln)}
#msg{padding:30px;color:var(--mut)}
@media(max-width:860px){main{grid-template-columns:1fr;height:auto}#chart{height:70vh}}
</style></head><body>
<header><h1>♪ プロセカ 譜面ビューア</h1><span id="st">楽曲データ取得中…</span></header>
<main>
<aside>
 <section class="p"><h2>① 楽曲を選ぶ</h2><input id="q" placeholder="曲名・読み・作詞作曲編曲・ID で検索"><div id="list"></div></section>
 <section class="p" id="sel" hidden><div id="card"><img id="jk" alt=""><div><h3 id="tt"></h3><div class="mut" id="pr"></div><div class="mut" id="cr"></div></div></div><div id="dif"></div></section>
 <section class="p"><h2>② 譜面データ（SUS / SVG）</h2>
  <div class="mut">URL（曲と難易度の選択で自動入力。SUS取得に失敗した場合はSVG画像を試します）</div>
  <div class="row"><input id="url" placeholder="SUS/TXT URL または SVG URL"><button id="goU">読込</button></div>
  <div class="mut">またはテキストを貼り付け</div>
  <textarea id="txt" placeholder="#BPM01: 120&#10;#00008: 01&#10;#00012: 11000000 …"></textarea>
  <div class="row"><button id="goT">貼り付けから描画</button><button id="smp" class="g">サンプル</button></div></section>
 <section class="p"><h2>③ 表示</h2><div class="mut">拡大（1拍あたり px）</div><input id="zm" type="range" min="16" max="80" value="36">
  <div class="mut" style="margin-top:6px">1列あたりの小節数</div><select id="bpc"><option>4</option><option selected>8</option><option>12</option><option>16</option></select></section>
</aside>
<section id="view"><div id="bar"></div><div id="legend"></div><div id="chart"><div id="msg">左で曲と難易度を選ぶか、SUSを貼り付けてください。</div></div></section>
</main>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MASTER='https://sekai-world.github.io/sekai-master-db-diff/',DIFFS=['easy','normal','hard','expert','master','append'];
const DCOL={easy:'#4fc95b',normal:'#34a9ee',hard:'#f09a1a',expert:'#ec4264',master:'#a94fe0',append:'#ee6fbd'};
const pad=(n,l)=>String(n).padStart(l,'0');
const jacket=m=>{const a=m.assetbundleName||'jacket_s_'+pad(m.id,3);return`https://storage.sekai.best/sekai-jp-assets/music/jacket/${a}/${a}.png`};
const baseURL=(id,d)=>`https://storage.sekai.best/sekai-jp-assets/music/music_score/${pad(id,4)}_01/${d}`;
/* ---------- SUS parser (pjsekai.scores と同じ解釈) ---------- */
const gcd=(a,b)=>b?gcd(b,a%b):a;
function pairs(d,m){const n=Math.floor(d.length/2),o=[];for(let i=0;i<n;i++){const v=d.substr(2*i,2);if(v==='00')continue;const g=gcd(i,n);o.push({v,bar:m+i/n,bk:m+':'+i/g+'/'+n/g})}return o}
function parseSUS(text){
 const bpmDef={},ev=[],raw=[],meta={};let m,x;
 for(const l0 of text.split(/\r?\n/)){const l=l0.trim();if(l[0]!=='#')continue;
  if(m=l.match(/^#(\w+)\s+(.*)$/)){meta[m[1].toUpperCase()]=m[2].replace(/^"|"$/g,'');continue}
  if(!(m=l.match(/^#(\w+):\s*(.*)$/)))continue;const h=m[1],d=m[2];
  if(x=h.match(/^(\d{3})02$/))ev.push({bar:+x[1],len:parseFloat(d)});
  else if(x=h.match(/^BPM(..)$/i))bpmDef[parseInt(x[1],36)]=parseFloat(d);
  else if(x=h.match(/^(\d{3})08$/))pairs(d,+x[1]).forEach(p=>ev.push({bar:p.bar,bpmId:parseInt(p.v,36)}));
  else if(x=h.match(/^(\d{3})1(.)$/))pairs(d,+x[1]).forEach(p=>raw.push({k:'tap',bar:p.bar,bk:p.bk,lane:parseInt(x[2],36),w:parseInt(p.v[1],36),t:parseInt(p.v[0],36)}));
  else if(x=h.match(/^(\d{3})5(.)$/))pairs(d,+x[1]).forEach(p=>raw.push({k:'dir',bar:p.bar,bk:p.bk,lane:parseInt(x[2],36),w:parseInt(p.v[1],36),t:parseInt(p.v[0],36)}));
  else if(x=h.match(/^(\d{3})([39])(.)(.)$/))pairs(d,+x[1]).forEach(p=>raw.push({k:'sl',bar:p.bar,bk:p.bk,lane:parseInt(x[3],36),w:parseInt(p.v[1],36),t:parseInt(p.v[0],36),ch:parseInt(x[4],36),deco:x[2]==='9'}));
 }
 ev.forEach(e=>{if(e.bpmId!==undefined)e.bpm=bpmDef[e.bpmId]});
 raw.sort((a,b)=>a.bar-b.bar);
 const del=new Set(),by={},same=(a,b)=>a.lane===b.lane&&a.w===b.w;
 raw.forEach((n,i)=>{if(!(n.lane>=2&&n.lane<14)){del.add(i);ev.push({bar:n.bar,text:n.lane===0?'SKILL':n.t===1?'FEVER CHANCE!':'SUPER FEVER!!'});return}(by[n.bk]??=[]).push(i)});
 raw.forEach((d,i)=>{if(del.has(i)||d.k!=='dir')return;for(const j of by[d.bk]){const t=raw[j];if(!del.has(j)&&t.k==='tap'&&same(t,d)){del.add(j);d.tap=t}}});
 raw.forEach((s,i)=>{if(del.has(i)||s.k!=='sl')return;s.head??=s;
  for(const j of by[s.bk]){const t=raw[j];if(!del.has(j)&&t.k==='tap'&&same(t,s)){del.add(j);s.tap=t}}
  for(const j of by[s.bk]){const d=raw[j];if(!del.has(j)&&d.k==='dir'&&same(d,s)){del.add(j);s.dir=d;if(d.tap)s.tap=d.tap}}
  if(s.t!==2)for(let j=i+1;j<raw.length;j++){const n=raw[j];if(del.has(j)||n.k!=='sl'||n.ch!==s.ch||n.deco!==s.deco)continue;s.next=n;n.head=s.head;break}});
 return{meta,ev:ev.sort((a,b)=>a.bar-b.bar),notes:raw.filter((_,i)=>!del.has(i))};
}
const crit=n=>n.k==='tap'?[2,6,8].includes(n.t):n.k==='dir'?!!(n.tap&&crit(n.tap)):!!((n.tap&&crit(n.tap))||(n.dir&&crit(n.dir))||(n.head!==n&&crit(n.head)));
const trend=n=>n.k==='tap'?[5,6].includes(n.t):n.k==='dir'?!!(n.tap&&trend(n.tap)):!!((n.tap&&trend(n.tap))||(n.dir&&trend(n.dir)));
const none=n=>n.k==='tap'?[7,8].includes(n.t):n.k==='sl'?!!(n.tap&&none(n.tap)):false;
const isPath=s=>s.t===0?false:s.t!==3?true:!!s.dir||(!s.tap&&!s.dir);
/* ---------- ノーツ描画（ゲーム内デザインを再現したSVG） ---------- */
const LW=20,PL=46,PR=64,COLW=PL+12*LW+PR,TOP=30;
const C={tap:['#eaf0ff','#9c8be8','#8fa4f7'],long:['#e5fbee','#4fd9a0','#4fd9a0'],flick:['#ffeaf0','#ee7a98','#f4a3b6'],crit:['#fff7da','#f1b42e','#f6c84a'],dmg:['#efe5fa','#6f43a8','#8d63c4']};
const body=(x,y,w,k,a=1,h=14)=>{const c=C[k];return`<g opacity="${a}"><rect x="${x-2}" y="${y-h/2-2}" width="${w+4}" height="${h+4}" rx="8" fill="${c[1]}" opacity=".25"/><rect x="${x}" y="${y-h/2}" width="${w}" height="${h}" rx="6" fill="${c[0]}" stroke="${c[1]}" stroke-width="2"/>${k==='tap'&&h>8?`<rect x="${x+2}" y="${y+h/2-3.5}" width="${w-4}" height="3" rx="1.5" fill="#43dcf3"/>`:''}${h>8?`<rect x="${x+3}" y="${y-3}" width="4" height="6" rx="1" fill="${c[2]}"/><rect x="${x+w-7}" y="${y-3}" width="4" height="6" rx="1" fill="${c[2]}"/>`:''}</g>`};
const gem=(x,y,k)=>{const f=k==='crit'?['#f8d24f','#d9981a']:k==='flick'?['#f598b1','#d85a82']:['#6fe3b8','#27b185'];return`<polygon points="${x},${y-7} ${x+6.5},${y} ${x},${y+7} ${x-6.5},${y}" fill="${f[0]}" stroke="${f[1]}" stroke-width="1.5"/><polygon points="${x},${y-7} ${x-6.5},${y} ${x},${y}" fill="#fff" opacity=".8"/>`};
const arrow=(cx,y,w,dir,k)=>{const f=k==='crit'?['#f7c21f','#e29408']:['#f0728f','#d93f66'],a=8+Math.min(w,6)*3.2,b=7+Math.min(w,6)*1.6;return`<g transform="translate(${cx+dir*LW/3} ${y-9}) rotate(${dir*28})"><polygon points="${-a},0 0,${-b} ${a},0 ${a},6 0,${6-b} ${-a},6" fill="${f[0]}" stroke="${f[1]}" stroke-width="1.6" stroke-linejoin="round"/></g>`};
const dirOf=n=>{const d=n.k==='dir'?n:n.dir;return!d?null:d.t===3?-1:d.t===4?1:d.t===1?0:d.t===2?0:null};
/* ---------- レイアウト & SVG生成 ---------- */
function render(S,ppb,BPC){
 const{notes,ev}=S;let maxBar=0;notes.forEach(n=>maxBar=Math.max(maxBar,n.bar));ev.forEach(e=>maxBar=Math.max(maxBar,e.bar));
 const total=Math.floor(maxBar+1e-9)+1,len=[],cum=[0];let cl=4,ei=0;const lens=ev.filter(e=>e.len).sort((a,b)=>a.bar-b.bar);
 for(let b=0;b<=total;b++){while(ei<lens.length&&lens[ei].bar<=b)cl=lens[ei++].len;len[b]=cl;cum[b+1]=cum[b]+cl}
 const cb=B=>{const m=Math.min(Math.floor(B+1e-9),total);return cum[m]+(B-m)*len[m]},nc=Math.ceil(total/BPC);
 let colH=0;for(let c=0;c<nc;c++)colH=Math.max(colH,(cb(Math.min((c+1)*BPC,total))-cb(c*BPC))*ppb);
 const bot=TOP+colH,H=bot+26,Y=(c,B)=>bot-(cb(B)-cb(c*BPC))*ppb,X=n=>PL+(n.lane-2)*LW,col=n=>Math.min(nc-1,Math.floor(n.bar/BPC+1e-9));
 /* ロング（スライド）の経路 */
 const chains=[];notes.filter(n=>n.k==='sl'&&n.t===1).forEach(s=>{let a=s;const segs=[],gems=[];while(a.t!==2&&a.next){let b=a.next;const mid=[];for(;;){if(b.t===3)mid.push(b);if(isPath(b)||!b.next)break;b=b.next}segs.push([a,b]);gems.push(...mid);a=b}if(segs.length)chains.push({s,segs,gems,c0:s.bar,c1:segs[segs.length-1][1].bar})});
 const cnt={tap:0,crit:0,flick:0,hold:0,relay:0,trace:0,dmg:0};let combo=0;const cols=Array.from({length:nc},()=>({g:[],p:[],n:[],m:[],a:[],t:[]}));
 chains.forEach(ch=>{const cr=crit(ch.s);for(let c=Math.floor(ch.c0/BPC+1e-9);c<=Math.min(nc-1,Math.floor(ch.c1/BPC+1e-9));c++){let L='',R='';ch.segs.forEach(([a,b],i)=>{const y0=Y(c,a.bar),y1=Y(c,b.bar),d=(y1-y0)/3,l0=X(a),r0=l0+a.w*LW,l1=X(b),r1=l1+b.w*LW;L+=(i?'':`M${l0} ${y0}`)+`C${l0} ${y0+d} ${l1} ${y0+2*d} ${l1} ${y1}`;R=`C${r1} ${y0+2*d} ${r0} ${y0+d} ${r0} ${y0}`+R;if(i===ch.segs.length-1)R=`L${r1} ${y1}`+R});cols[c].p.push(`<path d="${L+R}Z" fill="${cr?'#fcefb4':'#bff5da'}" opacity=".78"/>`)}
  ch.gems.forEach(m=>{if(none(m)||m.deco)return;const c=col(m),seg=ch.segs.find(([a,b])=>a.bar<=m.bar&&m.bar<=b.bar)||ch.segs[0],[a,b]=seg,y0=Y(c,a.bar),y1=Y(c,b.bar),ym=Y(c,m.bar),f=y1===y0?0:(ym-y0)/(y1-y0),s=f*f*(3-2*f),xa=X(a)+a.w*LW/2,xb=X(b)+b.w*LW/2;cols[c].a.push(gem(xa+(xb-xa)*s,ym,crit(m)?'crit':'long'))})});
 notes.forEach(n=>{if(n.deco||none(n))return;const c=col(n),y=Y(c,n.bar),x=X(n)+1,w=n.w*LW-2,cr=crit(n),tr=trend(n),k=n.k,d=dirOf(n);let kind;
  if(k==='tap'){if(n.t===4){kind='dmg';cnt.dmg++}else if(tr){kind=cr?'crit':'tap';cnt.trace++;combo++}else{kind=cr?'crit':'tap';cnt[cr?'crit':'tap']++;combo++}}
  else if(k==='dir'){kind=cr?'crit':'flick';if(tr)cnt.trace++;else cnt.flick++;combo++}
  else{if(n.t===5||n.t===0)return;if(n.t===3&&!n.tap&&!n.dir){cnt.relay++;combo++;return}
   if(n.t===3){cnt.relay++;combo++}else{combo++;if(n.t===1)cnt.hold++}
   kind=cr?'crit':n.t===2&&n.dir?'flick':'long';if(tr)cnt.trace++;else if(n.dir&&n.t===2)cnt.flick++}
  cols[c].n.push(body(x,y,w,kind,tr?.55:1,tr?6:14));if(tr)cols[c].a.push(gem(X(n)+n.w*LW/2,y,cr?'crit':k==='dir'||n.dir?'flick':'long'));
  if(d!==null&&!tr)cols[c].a.push(arrow(X(n)+n.w*LW/2,y,n.w,d,cr?'crit':'flick'))});
 /* 列ごとに組み立て */
 let out='';for(let c=0;c<nc;c++){const b0=c*BPC,b1=Math.min(b0+BPC,total),o=cols[c],ox=c*COLW;let g='';
  for(let i=0;i<12;i++)g+=`<rect x="${PL+i*LW}" y="${TOP}" width="${LW}" height="${colH}" fill="${i%2?'#eef5fd':'#f8fbff'}"/>`;
  for(let i=0;i<=12;i++)g+=`<line x1="${PL+i*LW}" x2="${PL+i*LW}" y1="${TOP}" y2="${bot}" stroke="#cfdcf0" stroke-width="${i%12?1:1.5}"/>`;
  for(let b=b0;b<=b1;b++){const y=Y(c,b);g+=`<line x1="${PL-4}" x2="${PL+12*LW}" y1="${y}" y2="${y}" stroke="#9db4d6" stroke-width="1.6"/>`;if(b<b1||b===total)g+=`<text x="${PL-8}" y="${y+4}" text-anchor="end" font-size="11" font-weight="700" fill="#5b7194">${b}</text>`;
   if(b<b1)for(let k=1;k<len[b];k++){const yy=Y(c,b+k/len[b]);g+=`<line x1="${PL}" x2="${PL+12*LW}" y1="${yy}" y2="${yy}" stroke="#dbe6f5" stroke-width="1"/>`}}
  ev.forEach(e=>{if(e.bar<b0||e.bar>=b1+(c===nc-1?1:0)||(!e.bpm&&!e.text))return;const y=Y(c,e.bar);if(e.bpm)g+=`<text x="${PL+12*LW+6}" y="${y-3}" font-size="11" font-weight="700" fill="#d98a00">♩${+(+e.bpm).toFixed(2)}</text>`;if(e.text)g+=`<text x="${PL+12*LW+6}" y="${y+12}" font-size="10" font-weight="700" fill="${e.text==='SKILL'?'#2fa6e8':e.text[0]==='F'?'#ee4a6e':'#a94fe0'}">${e.text}</text>`});
  out+=`<g transform="translate(${ox} 0)"><clipPath id="k${c}"><rect x="0" y="${TOP}" width="${COLW}" height="${colH}"/></clipPath>${g}<g clip-path="url(#k${c})">${o.p.join('')}</g>${o.n.join('')}${o.a.join('')}<text x="${PL}" y="16" font-size="11" fill="#74829f">小節 ${b0}–${b1-1}</text></g>`}
 return{svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${nc*COLW}" height="${H}" font-family="system-ui,sans-serif">${out}</svg>`,cnt,combo,total};
}
/* ---------- UI ---------- */
let songs=[],diffs={},cur=null,curD=null,auto='',externalSvgMode=false,loadSeq=0;
const st=t=>$('#st').textContent=t,jget=u=>fetch(MASTER+u).then(r=>{if(!r.ok)throw 0;return r.json()});
const LEG=(()=>{const f=(w,k,dr)=>`<svg width="${w*LW+20}" height="34"><g transform="translate(10 0)">${body(1,24,w*LW-2,k)}${dr===undefined?'':arrow(w*LW/2,24,w,dr,k==='crit'?'crit':'flick')}</g></svg>`;
 return[['タップ',f(2,'tap')],['クリティカル',f(2,'crit')],['フリック',f(2,'flick',0)],['ロング',f(2,'long')],['中継点',`<svg width="30" height="34"><g>${gem(15,20,'long')}</g></svg>`],['トレース',`<svg width="52" height="34"><g>${body(6,20,40,'tap',.55,6)}${gem(26,20,'long')}</g></svg>`],['ダメージ',f(2,'dmg')]].map(([n,s])=>`<span style="display:inline-flex;align-items:center;font-size:11px;margin-right:6px">${s}${n}</span>`).join('')})();
$('#legend').innerHTML=LEG;
function drawList(){const k=$('#q').value.trim().toLowerCase(),hit=songs.filter(s=>!k||[s.id,s.title,s.pronunciation,s.lyricist,s.composer,s.arranger].join('\n').toLowerCase().includes(k));
 $('#list').innerHTML=hit.slice(0,120).map(s=>`<button class="it ${cur&&cur.id===s.id?'on':''}" data-id="${s.id}"><img loading="lazy" src="${jacket(s)}" alt=""><span><b>${esc(s.title)}</b><small>#${s.id} ／ ${esc(s.composer||'')}</small></span></button>`).join('')+(hit.length>120?`<p class="mut">他 ${hit.length-120} 件… 検索で絞り込んでください</p>`:'')}
function pick(id){cur=songs.find(s=>s.id==id);$('#sel').hidden=false;$('#jk').src=jacket(cur);$('#tt').textContent=cur.title;$('#pr').textContent=cur.pronunciation||'';
 $('#cr').textContent=`作詞 ${cur.lyricist||'-'} ／ 作曲 ${cur.composer||'-'} ／ 編曲 ${cur.arranger||'-'}`;const ds=diffs[id]||{};
 $('#dif').innerHTML=DIFFS.filter(d=>ds[d]).map(d=>`<span class="dc" data-d="${d}" style="background:${DCOL[d]};color:#fff"><button style="all:unset;cursor:pointer">${d.toUpperCase()} Lv${ds[d].playLevel}・${ds[d].totalNoteCount}</button></span>`).join('')||'<span class="mut">難易度情報なし</span>';
 drawList();const first=DIFFS.filter(d=>ds[d]).pop();if(first)setDiff(first)}
function setDiff(d){curD=d;document.querySelectorAll('.dc').forEach(e=>e.classList.toggle('on',e.dataset.d===d));auto=baseURL(cur.id,d)+'.txt';$('#url').value=auto;loadURL()}
const uniqueURLs=xs=>[...new Set(xs.filter(Boolean))];
function susCandidates(u){
 const clean=u.split(/[?#]/)[0],hasExt=/\.(txt|sus)$/i.test(clean),base=clean.replace(/\.(txt|sus)$/i,'');
 if(hasExt)return uniqueURLs([u,base+'.txt',base+'.sus',base]);
 return uniqueURLs([u+'.txt',u+'.sus',u]);
}
function svgCandidates(u){
 if(/\.svg(?:[?#]|$)/i.test(u))return [u];
 const out=[];
 try{
  const parsed=new URL(u,location.href),m=parsed.pathname.match(/\/music\/music_score\/([^/]+)\/([^/]+?)(?:\.(?:txt|sus|svg))?$/i);
  if(m){
   const folder=m[1],diff=m[2].replace(/\.(?:txt|sus|svg)$/i,'');
   out.push(`https://asset3.pjsekai.moe/music/music_score/${folder}/${diff}.svg`);
   out.push(new URL(parsed.pathname.replace(/\.(?:txt|sus)$/i,'.svg'),parsed.origin).href);
  }
 }catch(e){}
 if(cur&&curD)out.push(`https://asset3.pjsekai.moe/music/music_score/${pad(cur.id,4)}_01/${curD}.svg`);
 const clean=u.split(/[?#]/)[0];
 if(/\.(txt|sus)$/i.test(clean))out.push(clean.replace(/\.(txt|sus)$/i,'.svg'));
 return uniqueURLs(out);
}
function showSvg(urls,seq=loadSeq){
 if(seq!==loadSeq)return;
 externalSvgMode=true;$('#bar').innerHTML='<span class="ch">SVG譜面画像を表示中（この画像からのノーツ集計・小節分割・独自ズームはできません）</span>';
 $('#legend').innerHTML='';$('#chart').replaceChildren();
 const img=document.createElement('img');img.className='remote-svg';img.alt='外部SVG譜面';let i=0;
 const next=()=>{
  if(seq!==loadSeq)return;
  if(i>=urls.length){
   const box=document.createElement('div');box.id='msg';box.textContent='譜面データを取得できませんでした。URLが正しいか確認するか、SUSテキストを貼り付けてください。';
   if(urls[0]){const a=document.createElement('a');a.href=urls[0];a.target='_blank';a.rel='noopener noreferrer';a.textContent='候補URLを別タブで開く';box.append(document.createElement('br'),a)}
   $('#chart').replaceChildren(box);st('取得失敗（SUS / SVG ともに読み込めません）');return;
  }
  const candidate=urls[i++];img.onload=()=>{if(seq!==loadSeq)return;$('#url').value=candidate;$('#chart').replaceChildren(img);st(`SVG譜面を表示しました（${new URL(candidate,location.href).host}）`)};img.onerror=next;img.src=candidate;
 };
 if(!urls.length){next();return}next();
}
async function loadURL(){
 const u=$('#url').value.trim();if(!u)return;const seq=++loadSeq;
 if(/\.svg(?:[?#]|$)/i.test(u)){showSvg([u],seq);return}
 st('SUS譜面を取得中…');
 for(const c of susCandidates(u)){
  if(seq!==loadSeq)return;
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),7000);
  try{
   const r=await fetch(c,{cache:'no-cache',signal:controller.signal});if(!r.ok)continue;
   const t=await r.text();if(!/^\s*#/m.test(t)||!/^\s*#.*:/m.test(t))continue;
   if(seq!==loadSeq)return;$('#txt').value=t;if(draw(t)){st(`SUSを取得して描画しました（${new URL(c,location.href).host}）`);return}
  }catch(e){}finally{clearTimeout(timer)}
 }
 if(seq===loadSeq){st('SUS取得に失敗。SVG画像を試しています…');showSvg(svgCandidates(u),seq)}
}
function draw(text){externalSvgMode=false;$('#legend').innerHTML=LEG;try{const S=parseSUS(text),R=render(S,+$('#zm').value,+$('#bpc').value),o=cur&&curD&&diffs[cur.id]&&diffs[cur.id][curD],c=R.cnt;
 const sum=c.tap+c.crit+c.flick+c.hold+c.relay+c.trace;
 $('#bar').innerHTML=[['タップ',c.tap],['クリティカル',c.crit],['フリック',c.flick],['ロング',c.hold],['中継点',c.relay],['トレース',c.trace],['ダメージ',c.dmg]].map(([n,v])=>`<span class="ch">${n} <b>${v}</b></span>`).join('')+`<span class="ch">小節 <b>${R.total}</b></span>`+(o?`<span class="ch ${o.totalNoteCount===R.combo?'ok':'ng'}">解析コンボ数 <b>${R.combo}</b> ／ 公式 ${o.totalNoteCount}</span>`:`<span class="ch">コンボ数(推定) <b>${R.combo}</b></span>`);
 $('#chart').innerHTML=R.svg;st(`描画しました（ノーツ ${S.notes.length}）`);return true}catch(e){st('解析エラー: '+e.message);console.error(e);return false}}
